/* ===== ESTUDAMENTE STUDIO · visual system 4.0 =====
   Pure CSS progressive redesign. Original content, state, scheduler and data remain intact. */
:root {
  color-scheme:light;
  --bg:#f4f6fb; --surface:#ffffff; --surface2:#f7f8fc;
  --ink:#182139; --muted:#73809a; --line:#e8ecf4;
  --primary:#634be2; --primary2:#f0edff;
  --positive:#117f71; --positivebg:#e5f6f1;
  --warning:#a66b20; --warningbg:#fff5e4;
  --negative:#c14e62; --negativebg:#fff0f2;
  --shadow:0 5px 18px rgba(27,38,72,.035),0 22px 58px rgba(27,38,72,.04);
  --radius:22px;
  --side:#121a31; --side-soft:#202943; --side-ink:#b0bbd1;
  --glow:#9274ff;
  --focus:#a37aff;
}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#0c1221; --surface:#172037; --surface2:#1c2842;
  --ink:#f5f6fd; --muted:#a0acc5; --line:#2d3953;
  --primary:#b2a0ff; --primary2:#302b53;
  --positive:#7ee1c1; --positivebg:#1d4842;
  --warning:#ffd595; --warningbg:#4d3929;
  --negative:#ffabb7; --negativebg:#4e303e;
  --shadow:0 8px 36px rgba(0,0,0,.15);
  --side:#080e1c; --side-soft:#1b2641; --side-ink:#aab6d0;
  --focus:#c4a9ff;
}
html{scroll-behavior:smooth}body{font-family:Inter,"Aptos",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.57;letter-spacing:-.008em;background:var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:450px;background:radial-gradient(ellipse 480px 320px at 93% 10%,rgba(117,97,251,.07),transparent 73%),radial-gradient(ellipse 350px 260px at 36% 0,rgba(52,178,178,.045),transparent 76%);pointer-events:none;z-index:0}
h1,h2,h3,h4{font-family:Inter,"Aptos Display",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);font-weight:800;letter-spacing:-.055em}h1{font-size:clamp(34px,3.4vw,47px);line-height:1.1}h2{font-size:24px;line-height:1.2}h3{font-size:18px;line-height:1.26}p{line-height:1.65}small,.small{font-size:12px;line-height:1.56}.muted{color:var(--muted)}
::selection{background:rgba(122,103,239,.24);color:var(--ink)}
:focus-visible{outline:3px solid var(--focus)!important;outline-offset:3px}
button,a,input,select,textarea{transition:background-color .18s ease,border-color .18s ease,box-shadow .18s ease,transform .18s ease,color .18s ease}
button:active:not(:disabled){transform:translateY(1px)}
/* LAYOUT & SIDEBAR */
.layout{grid-template-columns:259px minmax(0,1fr);position:relative;z-index:1}
.sidebar{height:100dvh;background:var(--side);border-right:1px solid rgba(255,255,255,.06);padding:31px 16px 20px;gap:25px;box-shadow:8px 0 45px rgba(18,28,54,.025);overflow-y:auto;scrollbar-width:thin;scrollbar-color:#455274 transparent}
.brand{padding:0 14px;gap:11px;color:#fff;font-weight:850;font-size:21px;letter-spacing:-.07em;line-height:1.3;white-space:nowrap}
.brand .mark{position:relative;width:42px;height:42px;flex-shrink:0;border-radius:14px;background:linear-gradient(135deg,#a895ff,#6855f0 65%,#4c3fc2);color:#fff;box-shadow:0 8px 22px rgba(117,90,250,.38);font-size:23px;border:1px solid #ffffff5c}
.brand span span{color:#b6a7ff}
.sidebar:has(.nav)::before{content:"SUA ÁREA DE ESTUDOS";position:absolute;top:103px;left:30px;color:#65728e;letter-spacing:.17em;font-size:9px;font-weight:850}
.nav{gap:5px;margin-top:17px}.nav button{color:var(--side-ink);border:1px solid transparent;padding:13px 13px;border-radius:13px;font-size:13px;font-weight:650;min-height:47px;letter-spacing:.005em}
.nav button .ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;color:#8f9cba}
.nav button .ico svg,.gcm-tab svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.nav button:hover{background:#ffffff0a;color:#fff}.nav button:hover .ico{color:#d8d2ff}
.nav button.active{background:linear-gradient(100deg,rgba(134,119,255,.18),rgba(110,95,216,.10));color:#fff;border-color:rgba(157,145,255,.20);box-shadow:inset 3px 0 0 #ae99ff}
.nav button.active .ico{background:linear-gradient(150deg,rgba(173,151,255,.28),rgba(173,151,255,.05));color:#cabdff}
.sidebarfoot{background:linear-gradient(143deg,rgba(132,113,245,.14),rgba(42,57,88,.24));border:1px solid rgba(164,156,231,.18);border-radius:17px;padding:18px 15px;color:#e7e9fb;position:relative;overflow:hidden}
.sidebarfoot::before{content:"✧";font-size:21px;color:#c3b7ff;display:block;margin-bottom:9px}
.sidebarfoot strong{font-size:12px;color:#eef0ff;line-height:1.5}.sidebarfoot small{color:#a9b2c9;display:block;margin-top:7px;font-size:11px}
.main{max-width:1760px;margin:auto;padding:34px clamp(24px,4.15vw,72px) 96px;position:relative}
.topline{margin-bottom:25px;gap:20px}.topline .eyebrow{color:#6b56d5}.topline #topdate{text-transform:capitalize;margin-top:4px;color:var(--muted);font-size:12px}
.eyebrow{font-size:10px;letter-spacing:.19em;line-height:1.4;font-weight:850;color:var(--primary)}
.toptools{gap:9px}.pill{font-size:11px;font-weight:750;letter-spacing:.01em;color:#7461da;background:#eeeaff;border:1px solid #e5e0ff;padding:9px 14px;white-space:nowrap}
:root[data-theme=dark] .pill{color:#d0c4ff;background:#302c55;border-color:#504574}
/* COMPONENTS */
.card{padding:24px 25px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);position:relative;transition:border-color .2s,box-shadow .24s,transform .24s}
.card.soft{background:var(--surface2);box-shadow:none}
.card:not(.soft):hover{border-color:color-mix(in srgb,var(--primary) 18%,var(--line));box-shadow:0 13px 36px rgba(45,48,94,.065),0 3px 12px rgba(45,48,94,.025)}
.grid{gap:18px}.grid.two{gap:18px}.grid.four{gap:15px}.stack{gap:20px}.row{column-gap:16px}.row h2,.row h3{margin-bottom:0}
.btn{border-radius:12px;background:linear-gradient(125deg,#725bf1,#6042da);color:#fff;padding:12px 18px;font-size:12px;font-weight:750;letter-spacing:.005em;min-height:42px;box-shadow:0 6px 16px rgba(89,65,214,.16);white-space:normal;text-align:center}
.btn:hover{filter:none;box-shadow:0 9px 21px rgba(87,67,209,.23);transform:translateY(-1px)}.btn:active{transform:translateY(0)}
.btn.secondary{background:var(--primary2);color:var(--primary);box-shadow:none;border-color:transparent}.btn.secondary:hover{background:color-mix(in srgb,var(--primary) 12%,var(--primary2));box-shadow:none}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink);box-shadow:none}.btn.ghost:hover{background:var(--surface2);border-color:color-mix(in srgb,var(--primary) 28%,var(--line));box-shadow:none}
.btn.danger{background:var(--negativebg);color:var(--negative);box-shadow:none}.btn.tiny{border-radius:10px;min-height:31px;padding:7px 11px;font-size:11px}
.why{font-weight:760;text-decoration:none;color:var(--primary);border-bottom:1px solid transparent}.why:hover{border-bottom-color:currentColor}
.chip{background:var(--primary2);color:var(--primary);border:1px solid color-mix(in srgb,var(--primary) 9%,var(--primary2));font-size:10px;font-weight:820;letter-spacing:.02em;border-radius:999px;padding:5px 10px}
.chip.green{background:var(--positivebg);color:var(--positive);border-color:transparent}.chip.orange{background:var(--warningbg);color:var(--warning);border-color:transparent}.chip.red{background:var(--negativebg);color:var(--negative);border-color:transparent}
.alert{border:1px solid color-mix(in srgb,var(--warning) 13%,transparent);padding:15px 18px;border-radius:13px;font-size:12px;line-height:1.7}
.alert.info{border-color:color-mix(in srgb,var(--primary) 12%,transparent)}.alert.good{border-color:color-mix(in srgb,var(--positive) 13%,transparent)}
.separator{background:var(--line);margin:21px 0}
.progress,.gcm-bartrack{background:var(--line);border-radius:20px;height:9px}
.progress span,.gcm-bartrack span{border-radius:20px}
.field{gap:7px}.field label,.field legend{font-size:12px;letter-spacing:-.008em;font-weight:770}
.field input,.field select,.field textarea,input.control,select.control,textarea.control{background:var(--surface2);border:1px solid var(--line);color:var(--ink);border-radius:12px;min-height:44px;padding:12px 14px;font-size:13px}
.field input:focus,.field select:focus,.field textarea:focus,input.control:focus,select.control:focus,textarea.control:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 13%,transparent)}
input::placeholder,textarea::placeholder{color:color-mix(in srgb,var(--muted) 78%,transparent)}
.task{padding:17px 0}.taskicon{border-radius:12px;width:43px;height:43px;background:var(--primary2);color:var(--primary)}.taskbody strong{font-size:13px}
.listline{padding:17px 0}.empty{padding:39px 15px;border:1px dashed color-mix(in srgb,var(--muted) 35%,var(--line));border-radius:15px;background:var(--surface2)}
.tablewrap{border-radius:12px}table{border-spacing:0}th,td{padding:13px 11px;border-color:var(--line)}th{font-size:10px;letter-spacing:.07em}tbody tr:hover{background:var(--surface2)}
dialog{border-radius:24px;border:1px solid var(--line);box-shadow:0 35px 100px rgba(4,9,28,.25);width:min(650px,calc(100% - 24px))}dialog::backdrop{background:rgba(8,13,34,.67);backdrop-filter:blur(5px)}.modalhead{padding:23px 26px}.modalbody{padding:24px 26px}.modalhead h3{font-size:20px}.close{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;padding:0}
.slideup{border:1px solid #ffffff26;background:#1e2242;color:#fff;border-radius:15px;box-shadow:0 20px 60px #141e414a;font-weight:650}
.footer{margin-top:38px;border-top:1px solid var(--line);padding-top:25px;font-size:11px}
/* MAIN HEROES */
.hero{padding:37px 40px;border-radius:26px;position:relative;overflow:hidden;min-height:225px;background:radial-gradient(circle at 91% 30%,rgba(142,128,255,.28),transparent 30%),linear-gradient(114deg,#152246 0%,#293469 52%,#554bc0 100%);box-shadow:0 20px 48px rgba(36,42,98,.16)}
.hero::before{content:"";position:absolute;right:12%;top:-145px;width:390px;height:390px;border:1px solid rgba(255,255,255,.11);border-radius:50%;box-shadow:0 0 0 40px rgba(255,255,255,.022),0 0 0 85px rgba(255,255,255,.02);pointer-events:none}
.hero::after{content:"";width:200px;height:200px;position:absolute;right:-85px;bottom:-143px;background:#b6a4ff70;filter:blur(70px);border-radius:50%;pointer-events:none}
.hero h1{color:#fff;font-size:clamp(30px,3.4vw,45px);margin-bottom:12px;max-width:700px;letter-spacing:-.06em}
.hero .eyebrow{color:#c2c2ff}.hero p{max-width:600px;color:#dce4fc}.hero .btn{background:#fff;color:#282956;box-shadow:none}.hero .btn:hover{background:#e7e6ff}
.heroart{color:#d2c6ff;text-shadow:0 0 45px #b6a7ff8f}
/* STUDIO / GCM */
.gcm-area{gap:20px;--gcm-indigo:#634be2;--gcm-aqua:#159f93}
.gcm-header{padding:39px 42px;min-height:227px;border:1px solid #ffffff16;border-radius:28px;box-shadow:0 22px 48px rgba(27,35,86,.15);background:radial-gradient(circle at 72% 90%,#7365ee70,transparent 37%),radial-gradient(circle at 100% -10%,#53c9c542,transparent 35%),linear-gradient(112deg,#152342 2%,#232c61 59%,#5148ac 100%)}
.gcm-header:before{content:"";position:absolute;width:390px;height:390px;border:1px solid #ffffff23;right:8%;top:-210px;border-radius:50%;box-shadow:0 0 0 36px #ffffff09,0 0 0 82px #ffffff06;pointer-events:none}
.gcm-header:after{content:"";width:220px;height:220px;position:absolute;top:auto;bottom:-182px;right:7%;border:65px solid #ffffff0b;border-radius:50%;transform:none;pointer-events:none}
.gcm-header>div:first-child{position:relative;z-index:1;max-width:630px}
.gcm-header .eyebrow{color:#c4c5ff;display:inline-flex;align-items:center;gap:9px}
.gcm-header .eyebrow:before{content:"";display:inline-block;width:7px;height:7px;background:#6ee6ca;border-radius:50%;box-shadow:0 0 0 5px #6ee6ca21}
.gcm-header h1{font-size:clamp(34px,3.7vw,48px);font-weight:850;margin:14px 0 14px;letter-spacing:-.065em;line-height:1.06;color:#fff}
.gcm-header p{color:#d3dcf4;font-size:13px;max-width:530px;line-height:1.72}
.gcm-deadline{min-width:184px;background:#ffffff12;border:1px solid #ffffff32;border-radius:21px;padding:22px 21px;box-shadow:inset 0 1px 0 #ffffff24;backdrop-filter:blur(17px);z-index:1}
.gcm-deadline small{color:#c7d0ec;text-transform:uppercase;letter-spacing:.07em;font-size:10px;font-weight:750}
.gcm-deadline strong{font-size:27px;letter-spacing:-.06em;margin:11px 0;color:#fff}
.gcm-deadline span{background:#ffffff23;color:#e4e5ff;font-size:11px;font-weight:700;padding:7px 10px;display:inline-block}
.gcm-tabrail{margin-top:-2px;padding:8px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px;gap:5px;scrollbar-width:none}
.gcm-tabrail::-webkit-scrollbar{display:none}.gcm-tab{padding:12px 14px;border-radius:11px;font-size:11px;font-weight:760;color:var(--muted);gap:9px}
.gcm-tab span{display:flex;align-items:center;justify-content:center;font-size:16px}.gcm-tab svg{width:16px;height:16px}
.gcm-tab.sel{background:var(--primary2);color:var(--primary);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--primary) 9%,transparent)}.gcm-tab:hover{color:var(--ink);background:var(--surface2)}.gcm-tab.sel:hover{color:var(--primary);background:var(--primary2)}
.gcm-sectionhead{padding:13px 2px 4px;gap:22px;min-height:85px}
.gcm-sectionhead .eyebrow{font-size:10px}.gcm-sectionhead h2{font-size:clamp(28px,2.9vw,35px);font-weight:850;letter-spacing:-.058em;margin:8px 0 6px}
.gcm-sectionhead p{font-size:13px;line-height:1.65}.gcm-sectionhead .btn{max-width:280px}
.gcm-area .grid.four{gap:15px}
.gcm-kpi{min-height:145px;border-top:0;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;padding:20px 22px 21px}
.gcm-kpi:before{content:"";position:absolute;width:90px;height:90px;border-radius:26px;background:radial-gradient(circle,#a4a0ff33,transparent 73%);right:-24px;top:-32px;pointer-events:none}
.gcm-kpi:after{content:"↗";position:absolute;right:21px;top:16px;font-size:14px;color:#8e83e8;background:var(--primary2);width:26px;height:26px;display:grid;place-items:center;border-radius:9px;opacity:.85}
.gcm-area .grid.four>.card:nth-child(2).gcm-kpi:after{content:"◷";color:#0b948e;background:#dff7f3}
.gcm-area .grid.four>.card:nth-child(3).gcm-kpi:after{content:"✎";color:#ad751e;background:#fff2d8}
.gcm-area .grid.four>.card:nth-child(4).gcm-kpi:after{content:"↻";color:#d35b73;background:#ffecf1}
:root[data-theme=dark] .gcm-area .grid.four>.card:nth-child(2).gcm-kpi:after,:root[data-theme=dark] .gcm-area .grid.four>.card:nth-child(3).gcm-kpi:after,:root[data-theme=dark] .gcm-area .grid.four>.card:nth-child(4).gcm-kpi:after{background:var(--surface2)}
.gcm-kpi .hint,.kpi .hint{color:var(--muted);font-size:11px;font-weight:720;letter-spacing:.005em;margin-bottom:12px}
.gcm-kpi strong,.kpi strong{font-size:clamp(30px,3vw,43px);letter-spacing:-.07em;color:var(--ink);line-height:1.05;font-weight:870}
.gcm-kpi .foot,.kpi .foot{color:var(--muted);font-size:11px;margin-top:14px}
.gcm-area .grid.two>.card{min-height:252px}.gcm-area .card h2{font-size:18px;font-weight:820;letter-spacing:-.044em;margin:0 0 9px}
.gcm-area .card>h2+p.small{margin:0 0 22px}.gcm-area .grid.three .card h2{font-size:17px}
.gcm-chart svg{min-height:140px;max-height:225px;overflow:visible}
.gcm-chart circle{transition:r .2s}.gcm-chart circle:hover{r:7}
.gcm-axis{font-size:10px}.gcm-ringrow{margin:5px auto 5px}
.gcm-ringrow svg{width:196px;height:196px;filter:drop-shadow(0 7px 15px #6758ed0b)}
.gcm-ringbig{font-size:36px;font-weight:850;letter-spacing:-.05em}.gcm-ringtiny{font-weight:650;font-size:12px}
.gcm-barset{gap:18px;margin:20px 0}.gcm-barline .row strong{font-size:12px}.gcm-bartrack{margin-top:9px}
.gcm-area .card.soft{background:linear-gradient(120deg,var(--surface2) 0%,color-mix(in srgb,var(--primary) 5%,var(--surface2)) 100%);border:1px solid var(--line)}
.gcm-area .card.soft:has(.btn){padding:22px 26px}
.gcm-area .card.soft:has(.btn) h3{font-size:17px;margin-bottom:5px}
.gcm-unit{padding:14px 10px;gap:13px;border-radius:12px}
.gcm-unit:hover{background:var(--surface2)}
.gcm-unitmark{height:40px;width:40px;border-radius:13px;font-size:19px}
.gcm-unitmark.blank{color:#97a2b5}.gcm-unitmark.started{color:var(--primary)}
.gcm-unitbody strong{font-size:13px}.gcm-unitbody small{font-size:11px}
.gcm-cyclebig{color:var(--primary);font-size:31px;letter-spacing:-.055em}.gcm-cyclebig span{font-size:14px;letter-spacing:0}
.gcm-square{height:43px;border-radius:11px;border-color:var(--line);background:var(--surface2);font-size:12px}.gcm-square:hover{border-color:var(--primary);box-shadow:0 0 0 2px color-mix(in srgb,var(--primary) 10%,transparent)}
.gcm-square.full{background:linear-gradient(130deg,#7c67f0,#5844d5)}
.gcm-week{padding:17px 12px;gap:14px;border-radius:12px}.gcm-week.current{background:var(--primary2)}.gcm-weeknumber{border-radius:13px;font-size:15px}
.gcm-record{border-radius:16px;padding:19px;background:var(--surface2)}
.gcm-disclaimer{font-size:11px;line-height:1.65;color:var(--muted);margin-top:4px}
.gcm-filters{gap:11px}.gcm-tabrail .gcm-tab:focus-visible{outline-offset:-3px}
/* OTHER MODULES */
.kpi{min-height:143px;padding:22px}.kpi strong{font-size:37px}.sectionhead{margin:26px 0 15px}.sectionhead h2{font-size:22px}
.calday{min-height:84px;border-radius:11px;border-color:var(--line)}.calday.today{border-color:var(--primary)}.calday:hover:not(:disabled){border-color:var(--primary);background:var(--primary2)}.calcount{border-radius:7px;padding:4px 7px}
.tabs button{border-radius:10px;font-size:12px}.tabs button.selected{border-color:color-mix(in srgb,var(--primary) 40%,transparent)}
.modecard{border-radius:14px;background:var(--surface)}.modecard:has(input:checked){box-shadow:0 0 0 2px color-mix(in srgb,var(--primary) 10%,transparent)}
.studyquestion{border-radius:17px;background:var(--surface2);font-size:22px;padding:23px}
.answerpanel{border-radius:12px;padding:19px}
@keyframes premiumAppear{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
.view{animation:premiumAppear .3s cubic-bezier(.18,.7,.3,1)}
/* INTERMEDIATE */
@media(max-width:1320px){.layout{grid-template-columns:231px minmax(0,1fr)}.sidebar{padding-left:12px;padding-right:12px}.brand{padding-left:11px}.main{padding-left:30px;padding-right:30px}.gcm-header{padding:34px 31px}.gcm-tab{padding:11px 12px}}
@media(max-width:1100px){.layout{grid-template-columns:211px minmax(0,1fr)}.nav button{padding:9px 8px;font-size:12px}.nav button .ico{width:30px;height:32px}.main{padding:25px 23px 95px}.grid.four{grid-template-columns:repeat(2,minmax(0,1fr))}.gcm-header h1{font-size:36px}.gcm-area .grid.four{grid-template-columns:repeat(2,minmax(0,1fr))}.gcm-kpi{min-height:134px}}
/* MOBILE */
@media(max-width:750px){
  body{font-size:13px}.layout{display:block}.sidebar{display:none}.main{padding:18px 14px 112px}
  .topline{margin-bottom:18px;align-items:flex-start}.topline .eyebrow{font-size:9px}.topline #topdate{font-size:11px}.pill{font-size:10px;padding:8px 11px}.toptools{gap:6px;justify-content:flex-end;flex-wrap:wrap}.toptools .btn.tiny{font-size:10px;padding:7px 9px}
  .navmobile{bottom:10px;left:10px;right:10px;justify-content:space-around;border:1px solid #ffffff20;border-radius:18px;background:rgba(19,27,48,.97);box-shadow:0 14px 40px rgba(11,21,52,.28);padding:8px 6px max(8px,env(safe-area-inset-bottom));backdrop-filter:blur(18px)}
  .navmobile button{color:#a3b0d0;font-size:10px;min-width:51px;border-radius:11px;padding:6px 5px;gap:3px}.navmobile button .ico{display:grid;place-items:center;height:24px}.navmobile button .ico svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round}
  .navmobile button.active{color:#e9e3ff;background:rgba(155,129,255,.18)}
  .gcm-header{padding:28px 24px;border-radius:22px;min-height:0}
  .gcm-header h1{font-size:36px;line-height:1.09;margin:13px 0}.gcm-header p{font-size:12px}.gcm-header::before{right:-135px}
  .gcm-deadline{margin-top:24px;max-width:none;width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 14px;text-align:left;border-radius:14px}
  .gcm-deadline strong{font-size:18px;margin:0}.gcm-deadline small{font-size:9px;max-width:70px}.gcm-deadline span{font-size:10px;white-space:nowrap}
  .gcm-tabrail{border-radius:14px;padding:6px;margin-right:-14px;margin-left:-14px;border-left:none;border-right:none;box-shadow:0 5px 18px rgba(30,43,71,.035)}
  .gcm-tab{padding:10px 12px;font-size:11px}.gcm-sectionhead{padding:9px 2px 3px;min-height:0}.gcm-sectionhead h2{font-size:28px}.gcm-sectionhead p{font-size:12px}.gcm-sectionhead>.btn{width:100%;max-width:none}
  .gcm-area .grid.four{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.gcm-kpi{min-height:130px;padding:18px 15px}.gcm-kpi .hint{font-size:10px;margin-bottom:15px}.gcm-kpi strong{font-size:32px}.gcm-kpi .foot{font-size:10px;margin-top:10px}.gcm-kpi:after{top:12px;right:12px;width:22px;height:22px;font-size:11px}
  .gcm-area .grid.two>.card{min-height:0}.gcm-area .card h2{font-size:17px}
  .grid.three,.grid.two{grid-template-columns:1fr}.grid.four{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{padding:19px 17px;border-radius:17px}.hero{padding:29px 23px;border-radius:22px}.hero h1{font-size:33px}.hero p{font-size:12px}

<script>
'use strict';
// >>> AGENDADOR-INICIO
const Scheduler=(()=>{
 const MS=86400000;
 const toDate=(v)=>v instanceof Date?new Date(v):new Date(v);
 const day=(d)=>{const z=toDate(d);return `${z.getFullYear()}-${String(z.getMonth()+1).padStart(2,'0')}-${String(z.getDate()).padStart(2,'0')}`};
 const local=(s)=>new Date(s+'T12:00:00');
 const plusDays=(date,n)=>new Date(toDate(date).getTime()+n*MS);
 const clamp=(x,min,max)=>Math.max(min,Math.min(max,x));
 const daysBetween=(a,b)=>(toDate(a).getTime()-toDate(b).getTime())/MS;
 const defaultConfig=()=>({targetRecall:.80,baseHalfLife:5,successFactor:1.9,assistedFactor:1.05,errorFactor:.60,lateSuccessBonus:.08,minimumGapDays:1,maximumGapDays:90,policy:'adaptive',uniformDays:4,priorityUrgency:2.3});
 const retain=(elapsed,h)=>Math.pow(2,-Math.max(0,elapsed)/Math.max(.01,h));
 const interval=(halfLife,cfg)=>clamp(cfg.policy==='uniform'?cfg.uniformDays:halfLife*(Math.log(1/cfg.targetRecall)/Math.LN2),cfg.minimumGapDays,cfg.maximumGapDays);
 function derive(topic,attempts,cfg=defaultConfig(),now=new Date(),deadline=''){
  const mine=attempts.filter(x=>x.topicId===topic.id).slice().sort((a,b)=>Date.parse(a.at)-Date.parse(b.at));
  let h=cfg.baseHalfLife;let prev=null;
  for(const a of mine){
   const realGap=prev?Math.max(0,daysBetween(a.at,prev.at)):null;
   const expected=interval(h,cfg);
   if(a.result==='alone'){
    const recallBonus=realGap!==null&&realGap>expected?1+Math.min(.25,Math.log2(1+realGap/Math.max(.01,expected))*cfg.lateSuccessBonus):1;
    h*=cfg.successFactor*recallBonus;
   }else if(a.result==='assisted'){h*=cfg.assistedFactor}
   else if(a.result==='wrong'){h*=cfg.errorFactor}
   h=clamp(h,.20,3650);prev=a;
  }
  const last=mine.length?mine[mine.length-1]:null;
  const exam=deadline?local(deadline):null;
  const today=local(day(now));
  if(exam&&exam.getTime()<today.getTime()) return {h,retention:last?retain(daysBetween(now,last.at),h):null,due:null,status:'encerrado',last,count:mine.length,gap:null,deadlineAdjusted:false};
  if(!last){return {h,retention:null,due:day(now),status:'não iniciado',last:null,count:0,gap:0,deadlineAdjusted:false}}

  let due=local(day(plusDays(local(day(last.at)),Math.ceil(gap))));
  let deadlineAdjusted=false;
  if(exam){const lastBefore=local(day(plusDays(exam,-1)));if(due>lastBefore&&lastBefore>local(day(last.at))){due=lastBefore;deadlineAdjusted=true}

  return {h,retention:retain(daysBetween(now,last.at),h),due:dueStr,status:!due?'além do prazo':dueStr<day(now)?'atrasada':dueStr===day(now)?'hoje':'agendada',last,count:mine.length,gap,deadlineAdjusted};
 }

  let d=derive(topic,attempts,cfg,now,deadline);if(!d.due)return [];

   if(deadline&&day(anchor)>=deadline)break;
   result.push({date:day(anchor),hypothetical:n>0,deadlineAdjusted:n===0&&d.deadlineAdjusted});
   h=clamp(h*cfg.successFactor,.20,3650);
   const next=local(day(plusDays(anchor,Math.ceil(interval(h,cfg)))));

 function plan(topics,attempts,cfg,availability,deadline,subjects,mode='normal',now=new Date()){
  const weekday=(toDate(now).getDay()+6)%7;
  const budget=Math.max(0,Number(availability[weekday]||0));
  const until=deadline?Math.max(0,daysBetween(local(deadline),local(day(now)))):null;
  const tasks=topics.map(t=>{
   const s=derive(t,attempts,cfg,now,deadline);const subj=subjects.find(x=>x.id===t.subjectId);

lass="btn" data-act="newSubject">+ Nova matéria</button></div><div class="alert info" style="margin:14px 0">Para revisar de verdade, cadastre ao menos uma pergunta com resposta ou critério de correção por assunto. ${whyBtn('recuperar')}</div><div class="stack">${rows||'<div class="empty"><span class="emoji">📚</span>Nenhuma matéria cadastrada. <button class="btn secondary" data-act="newSubject">Adicionar matéria</button></div>'}</div>`}

lo')}</h3><p class="muted">Quando há exemplo cadastrado: resolução comentada → atividade com apoio → exercício sem ajuda.</p></div></section></div>`}
function calendarEvents(){const map={};for(const t of db.topics){const f=Scheduler.forecast(t,db.attempts,db.config,new Date(),db.profile.deadline,10);for(const item of f){if(!map[item.date])map[item.date]=[];map[item.date].push({title:t.title,subject:subject(t)?.name||'',topicId:t.id,kind:item.hypothetical?'projeção condicional':'próxima revisão',hyp:item.hypothetical})}}return map}
function renderCalendar(){const now=new Date(),m=new Date(now.getFullYear(),now.getMonth()+monthOffset,1,12),yr=m.getFullYear(),mo=m.getMonth();const first=(m.getDay()+6)%7,count=new Date(yr,mo+1,0).getDate(),map=calendarEvents();let cells=days.map(x=>`<div class="calhead">${x}</div>`).join('');for(let i=0;i<first;i++)cells+='<div aria-hidden="true"></div>';for(let d=1;d<=count;d++){const key=Scheduler.day(new Date(yr,mo,d,12));const n=(map[key]||[]).length;cells+=`<button class="calday ${today()===key?'today':''} ${selectedDay===key?'selected':''}" data-act="selectDate" data-value="${key}" aria-label="${niceDate(key,{day:'numeric',month:'long'})}: ${n} revisões previstas"><span class="caldate">${d}</span>${n?`<span class="calcount">${n} prevista(s)</span>`:''}</button>`}const ev=map[selectedDay]||[];return `<div class="row"><div><h1>Calendário de revisões</h1><p class="muted">Datas provisórias: o plano futuro muda conforme os resultados reais.</p></div><button class="btn ghost" data-act="exportICS">↓ Exportar .ics</button></div><div class="alert info" style="margin:14px 0">Revisões além da próxima são <strong>simulações</strong> supondo futuros acertos sem ajuda. Não são compromissos nem previsão validada. ${whyBtn('revisao')}</div><div class="grid two"><div class="card"><div class="row" style="margin-bottom:15px"><button class="btn ghost tiny" data-act="monthPrev" aria-label="Mês anterior">←</button><h2 style="margin:0">${m.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</h2><button class="btn ghost tiny" data-act="monthNext" aria-label="Mês seguinte">→</button></div><div class="calendar">${cells}</div></div><div class="card"><h2>${niceDate(selectedDay,{weekday:'long',day:'numeric',month:'long'})}</h2>${ev.length?ev.map(x=>`<div class="task"><div class="taskicon">${x.hyp?'◌':'↻'}</div><div class="taskbody"><strong>${E(x.title)}</strong><small>${E(x.subject)} · ${E(x.kind)}</small></div><button class="btn secondary tiny" data-act="startSession" data-id="${E(x.topicId)}">Praticar</button></div>`).join(''):'<div class="empty">Nenhuma revisão prevista nessa data.</div>'}<div class="separator"></div><h3>Entenda a agenda ${whyBtn('prazo')}</h3><p class="muted tinytext">Atrasos aparecem quando uma revisão devida não foi realizada; não são acertos ou erros. Depois de uma atividade real, as projeções são refeitas.</p></div></div>`}
function buildCycle(){const weights=db.subjects.map(s=>({id:s.id,weight:Scheduler.clamp(Number(s.weight||1),1,5),cur:0}));const sum=weights.reduce((a,x)=>a+x.weight,0);if(!sum)return [];const seq=[];for(let i=0;i<sum;i++){for(const w of weights)w.cur+=w.weight;weights.sort((a,b)=>b.cur-a.cur);const pick=weights[0];seq.push(pick.id);pick.cur-=sum}return seq}
function renderCycles(){const seq=buildCycle();let ptr=db.cycles.pointer||0;const upcoming=[];for(let i=0;i<Math.min(seq.length*2,10);i++){const s=db.subjects.find(x=>x.id===seq[(ptr+i)%seq.length]);if(s)upcoming.push(s)}return `<div class="row"><div><h1>Ciclos de matérias</h1><p class="muted">Uma sequência flexível para distribuir seu estudo, sem alterar a agenda de revisões.</p></div>${whyBtn('ciclo')}</div><div class="grid two"><section class="card"><h2>Próxima matéria</h2>${seq.length?`<div class="hero" style="padding:20px;margin:13px 0"><div><div class="eyebrow">SEU CICLO ATUAL</div><h2 style="color:white;margin:7px 0">${E(upcoming[0]?.name||'—')}</h2><p style="color:#e2e4ff;font-size:12px">Siga a matéria e retome a sequência quando voltar.</p></div><div class="heroart" style="font-size:40px">↻</div></div><button class="btn wide" data-act="cycleNext">Concluí meu bloco → próxima matéria</button><p class="small" style="margin-top:10px">${db.cycles.completed||0} blocos concluídos · A duração do bloco é sua escolha.</p>`:'<div class="empty">Crie uma matéria para iniciar seu ciclo. <button class="btn secondary" data-nav="materias">Criar matéria</button></div>'}<div class="separator"></div><h3>Ordem dos próximos blocos</h3>${upcoming.map((s,i)=>`<div class="listline"><span class="chip">${i===0?'Agora':i+1+'º'}</span> <strong>${E(s.name)}</strong></div>`).join('')}</section><section class="stack"><div class="card"><div class="row"><h2>Peso de cada matéria</h2>${whyBtn('planejar')}</div><p class="muted">Pesos representam preferência relativa no ciclo, não quantidade ideal de horas demonstrada por estudos.</p>${db.subjects.map(s=>`<div class="listline"><div class="row"><strong>${E(s.name)}</strong><span class="chip">Peso ${s.weight||1}</span><button class="btn ghost tiny" data-act="editSubject" data-id="${E(s.id)}">Alterar</button></div></div>`).join('')||'<p>Sem matérias cadastradas.</p>'}</div><div class="card soft"><h3>Revisões são outra coisa</h3><p class="muted">Se function renderProgress(){const items=db.topics.map(t=>({topic:t,st:topicState(t)})),covered=items.filter(x=>x.st.count>0).length,of=items.length,alone=totalOf('alone'),assisted=totalOf('assisted'),wrong=totalOf('wrong'),n=alone+assisted+wrong;
const observed=n?Math.round(100*alone/n):null;
const cal=db.attempts.filter(a=>Number.isFinite(Number(a.confidence))&&a.confidence!==''),calErr=cal.length?Math.round(cal.reduce((sum,a)=>sum+Math.abs(Number(a.confidence)-(a.result==='alone'?100:0)),0)/cal.length):null;

return `<div class="row"><div><h1>Seu progresso, sem ilusões</h1><p class="muted">Separe o que você demonstrou do que o computador apenas estima.</p></div>${whyBtn('estimativa')}</div><div class="grid four" style="margin:16px 0"><div class="card kpi"><div class="hint">Cobertura observada</div><strong>${of?Math.round(100*covered/of)+'%':'—'}</strong><div class="foot">${covered}/${of} tópicos com tentativa</div></div><div class="card kpi"><div class="hint">Acertos sem ajuda</div><strong>${observed===null?'—':observed+'%'}</strong><div class="foot">${alone} de ${n} tentativas</div></div><div class="card kpi"><div class="hint">Acertos com consulta</div><strong>${assisted}</strong><div class="foot">Não são contados como acertos autônomos</div></div><div class="card kpi"><div class="hint">Erros observados</div><strong>${wrong}</strong><div class="foot">Registro para orientar a correção</div></div></div><div class="grid two"><section class="card"><div class="row"><h2>Estimativa por assunto</h2>${whyBtn('estimativa')}</div><div class="alert info">Modelo experimental, não calibrado. A porcentagem abaixo não é sua chance de acertar a prova.</div>${items.length?items.map(({topic,st})=>`<div class="meterrow"><div class="row"><strong>${E(topic.title)}</strong><span class="small">${st.count?`modelo: ${Math.round(st.retention*100)}%`:'sem dados'}</span></div><div class="progress"><span style="width:${st.count?Math.round(st.retention*100):0}%"></span></div><div class="small">${st.count} tentativa(s) · ${st.due?'próxima '+niceDate(st.due):'sem revisão prevista'}</div></div>`).join(''):'<div class="empty">O progresso aparece após cadastrar e praticar assuntos.</div>'}</section><section class="stack"><div class="card"><div class="row"><h2>Diário de erros <span class="small">[EXTRA · base no documento]</span></h2>${whyBtn('feedback')}</div>${Object.entries(patterns).sort((a,b)=>b[1]-a[1]).slice(0,9).map(([tag,n])=>`<div class="listline row"><strong>${E(tag)}</strong><span class="chip red">${n} ocorrência(s)</span></div>`).join('')||'<p class="muted">Sem erros registrados. Quando ocorrerem, anote o motivo durante a correção.</p>'}</div><div class="card"><div class="row"><h2>Confiança × realidade <span class="small">[EXTRA · base no documento]</span></h2>${whyBtn('confianca')}</div><p>${calErr===null?'Ainda não há respostas com confiança registrada.':`Distância média entre confiança declarada e acerto autônomo: <strong>${calErr} pontos percentuais</strong> (${cal.length} tentativas).`}</p><p class="small">Indicador descritivo simples, não nota nem diagnóstico: respostas assistidas contam como 0 para acerto autônomo.</p></div></section></div><section class="card" style="margin-top:17px"><h2>Histórico real de tentativas</h2>${recent.length?`<div class="tablewrap"><table><thead><tr><th>Quando</th><th>Assunto</th><th>Resultado</th><th>Tempo</th><th>Detalhes</th></tr></thead><tbody>${recent.map(a=>{const t=db.topics.find(x=>x.id===a.topicId);return `<tr><td>${niceDate(a.at,{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</td><td>${E(t?.title||'Assunto excluído')}</td><td>${a.result==='alone'?'<span class="chip green">Sem ajuda</span>':a.result==='assisted'?'<span class="chip orange">Com consulta</span>':'<span class="chip red">Erro</span>'}</td><td>${Number(a.minutes||0).toFixed(1)} min</td><td><button class="why" data-act="attemptDetail" data-id="${E(a.id)}">Ver registro</button></td></tr>`}).join('')}</tbody></table></div>`:'<p class="muted">Seu histórico ficará aqui depois da primeira sessão.</p>'}</section>`}

 cases.push(['Acerto sem ajuda aumenta a memória estimada',good.h>base.h]);

function splitSyllabus(raw){
 const cleaned=String(raw||'').replace(/\r/g,'').replace(/\u00a0/g,' ').slice(0,100000);
 let subjectName='',pairs=[];
 const headings=/^(L[ÍI]NGUA PORTUGUESA|PORTUGU[EÊ]S|MATEM[ÁA]TICA(?:\s*E\s*RACIOC[ÍI]NIO\s*L[ÓO]GICO)?|RACIOC[ÍI]NIO L[ÓO]GICO|INFORM[ÁA]TICA|CONHECIMENTOS GERAIS|ATUALIDADES|HIST[ÓO]RIA|GEOGRAFIA|DIREITO [A-ZÁÉÍÓÚÂÊÔÃÕÇ ]+|LEGISLA[ÇC][ÃA]O(?: [A-ZÁÉÍÓÚÂÊÔÃÕÇ ]+)?|CONHECIMENTOS ESPEC[ÍI]FICOS)\s*[:\-–]\s*/i;
 const lines=cleaned.split('\n');
 for(let line of lines){line=line.replace(/^\s*(?:\d+[.)-]|[-•●*])\s*/,'').trim();if(!line)continue;
  const m=line.match(headings);
  if(m){subjectName=normalSubject(m[1]);line=line.slice(m[0].length)}
  if(!subjectName){if(line.match(/^[A-ZÁÉÍÓÚÂÊÔÃÕÇ][A-ZÁÉÍÓÚÂÊÔÃÕÇ\s\/]{3,65}:$/)){subjectName=normalSubject(line.slice(0,-1));continue}subjectName='Conteúdos do edital'}
  const pieces=line.split(/[;\u2022]|\.(?=\s+[A-ZÁÉÍÓÚÂÊÔÃÕÇ]|\s*$)/g).map(x=>x.replace(/^[-–\d.)\s]+/,'').trim()).filter(x=>x.length>=3);
  for(const item of pieces)if(item.length<=130)pairs.push([subjectName,item]);else if(item.length>130){for(let j=0;j<item.length;j+=125)pairs.push([subjectName,item.slice(j,j+125).trim()])}
 }
 const seen=new Set();return pairs.filter(([s,t])=>{const key=(s+'|'+t).toLocaleLowerCase('pt-BR');if(seen.has(key))return false;seen.add(key);return true}).slice(0,400);
}

 const obj={id:q?.id||mkId(),topicId:v.topicId,prompt:v.prompt.trim().slice(0,4000),answer:'Alternativa '+String.fromCharCode(65+correct)+': '+opts[correct],explanation:(v.explanation||'').trim().slice(0,6000),hint:'',example:'',guided:'',guidedPrompt:'',guidedAnswer:'',options:opts,correct,source:(v.source||'').trim().slice(0,100)};

function submitBulkMCQ(v){let added=0,errors=0;for(const row of v.lines.split('\n').slice(0,2000)){
 if(!row.trim())continue;const parts=row.split(';').map(x=>x.trim());if(parts.length<6){errors++;continue}
 const prompt=parts.shift(),opts=parts.splice(0,5);let correctLetter=parts.shift()||'',source=parts.join(';');
 // Permite quatro alternativas quando a coluna E está vazia.
 while(opts.length>2&&!opts.at(-1))opts.pop();const correct='ABCDE'.indexOf(correctLetter.toUpperCase());
 if(!prompt||opts.some(x=>!x)||correct<0||correct>=opts.length){errors++;continue}
 db.questions.push({id:mkId(),topicId:v.topicId,prompt:prompt.slice(0,4000),answer:'Alternativa '+correctLetter.toUpperCase()+': '+opts[correct],explanation:'',options:opts,correct,source:source.slice(0,100)});added++;

function topicDepth(t,seen=new Set()){if(!t?.prerequisiteId||seen.has(t.id))return 0;const prev=db.topics.find(x=>x.id===t.prerequisiteId);if(!prev)return 0;const next=new Set(seen);next.add(t.id);return Math.min(20,1+topicDepth(prev,next))}

 }
 if(f.id==='questionForm'){

 if(f.id==='configForm'){

// Conteúdos referenciados da planilha. Registros novos são separados dos históricos existentes.
let GCM_SUBJECTS=[
 {name:'Português',color:'#6c65d9',weight:.4},
 {name:'Matemática',color:'#1a9a91',weight:.3},
 {name:'Conhecimentos Gerais',color:'#df9a3d',weight:.3}
];
const GCM_TABS=[['painel','◫','Painel'],['edital','☑','Edital'],['ciclo','◷','Ciclo de horas'],['semanas','▦','Cronograma'],['revisoes','↻','Revisões'],['questoes','✎','Questões e Anki'],['simulados','◎','Simulados'],['materiais','▤','Materiais'],['bemestar','♡','Bem-estar'],['log','≡','Retificações'],['config','⚙','Configurações']];
const GCM_STATUSES=['Não iniciado','Em estudo','Estudado','Dominado'];
let gcmTab='painel',gcmFind='',gcmSubjectFilter='',gcmStatusFilter='';
const gcmISO=()=>Scheduler.day(new Date());
const gcmMonday=(date)=>{const d=Scheduler.local(date);const shift=(d.getDay()+6)%7;d.setDate(d.getDate()-shift);return Scheduler.day(d)};
const gcmPlus=(date,n)=>Scheduler.day(Scheduler.plusDays(Scheduler.local(date),n));
function gcmBase(){return {version:1,setupAt:new Date().toISOString(),settings:{startDate:'2026-10-19',examDate:'2027-01-24',planningDeadline:'2027-01-18',weeklyHours:52,weights:{'Português':.4,'Matemática':.3,'Conhecimentos Gerais':.3},allocation:{'Português':.1724137931034483,'Matemática':.41379310344827586,'Conhecimentos Gerais':.41379310344827586},difficulty:{'Português':3,'Matemática':3,'Conhecimentos Gerais':3},revisionFraction:.1,revisionGrowth:1.8,revisionMinimum:1,revisionMaximum:45},unitState:{},cycles:{},weeks:{},reviews:[],questionLogs:[],mockExams:[],materials:[],wellness:[],amendments:[]}}
function gcmDB(){if(!db.gcm||typeof db.gcm!=='object')db.gcm=gcmBase();const x=db.gcm,d=gcmBase();x.settings={...d.settings,...x.settings,weights:{...d.settings.weights,...(x.settings?.weights||{})},allocation:{...d.settings.allocation,...(x.settings?.allocation||{})},difficulty:{...d.settings.difficulty,...(x.settings?.difficulty||{})}};for(const k of ['unitState','cycles','weeks'])if(!x[k]||typeof x[k]!=='object')x[k]={};for(const k of ['reviews','questionLogs','mockExams','materials','wellness','amendments'])if(!Array.isArray(x[k]))x[k]=[];return x}
function gcmN(v){const n=Number(v);return Number.isFinite(n)?n:0}
function gcmFmt(n,dp=0){return Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:dp,minimumFractionDigits:dp})}
function gcmP(n){return gcmFmt(100*n,1)+'%'}
function gcmObj(id){return GCM_SEED.units.find(x=>x.code===id)}
function gcmState(id){return gcmDB().unitState[id]||{status:'Não iniciado',studyDate:'',difficulty:3,priority:3,quality:'',notes:''}}
function gcmDate(s){return s?niceDate(s,{day:'2-digit',month:'short',year:'numeric'}):'—'}
function gcmCountdown(){if(!gcmDB().settings.examDate)return null;return Math.ceil(Scheduler.daysBetween(Scheduler.local(gcmDB().settings.examDate),Scheduler.local(gcmISO())))}
function gcmPlanCount(){return Math.ceil(Scheduler.daysBetween(Scheduler.local(gcmDB().settings.planningDeadline),Scheduler.local(gcmISO())))}
function gcmWeekKey(){return gcmMonday(gcmISO())}
function gcmBudget(){const g=gcmDB(), a=GCM_SUBJECTS.map(s=>({name:s.name,value:(g.settings.allocation[s.name]||0)*Math.max(1,gcmN(g.settings.difficulty[s.name]))})),tot=a.reduce((x,s)=>x+s.value,0)||1;return a.map(s=>({name:s.name,hours:g.settings.weeklyHours*s.value/tot,weight:g.settings.weights[s.name],allocation:g.settings.allocation[s.name],diff:g.settings.difficulty[s.name]}))}
function gcmCycleVals(subject,week=gcmWeekKey()){return gcmDB().cycles[week]?.[subject]||[]}
function gcmCycleDone(subject,week=gcmWeekKey()){return gcmCycleVals(subject,week).reduce((a,b)=>a+gcmN(b),0)}
function gcmSumWeek(week=gcmWeekKey()){return GCM_SUBJECTS.reduce((a,s)=>a+gcmCycleDone(s.name,week),0)}
function gcmStat(){const g=gcmDB(),s=GCM_SEED.units.map(x=>gcmState(x.code)),studied=s.filter(x=>x.status!=='Não iniciado').length,master=s.filter(x=>x.status==='Dominado').length;const q=g.questionLogs.reduce((a,x)=>({n:a.n+gcmN(x.questions),c:a.c+gcmN(x.correct),cards:a.cards+gcmN(x.cards)}),{n:0,c:0,cards:0});const r=g.reviews.length;const overdue=GCM_SEED.units.filter(x=>{const d=gcmReviewDue(x.code);return d&&d<gcmISO()}).length;return {studied,master,q,r,overdue,ratio:studied/GCM_SEED.units.length};}
function gcmReviewDue(id){const state=gcmState(id);if(!state.studyDate)return '';const g=gcmDB(),history=g.reviews.filter(x=>x.unitId===id).sort((a,b)=>a.date.localeCompare(b.date));const last=history.at(-1);const base=last?.date||state.studyDate;const daysToDeadline=Math.max(0,Math.ceil(Scheduler.daysBetween(Scheduler.local(g.settings.planningDeadline),Scheduler.local(state.studyDate))));const firstGap=Math.max(g.settings.revisionMinimum,Math.round(daysToDeadline*g.settings.revisionFraction));let gap=firstGap;if(last){const prev=history.length>1?history.at(-2).date:state.studyDate;const prevGap=Math.max(g.settings.revisionMinimum,Math.round(Scheduler.daysBetween(Scheduler.local(last.date),Scheduler.local(prev))));const accuracy=last.questions>0?last.correct/last.questions:null;const factor=accuracy===null?.4:accuracy<.5?.25:accuracy<.7?.4:accuracy<.85?.65:1;const difficulty={'Fácil':1.1,'Média':1,'Difícil':.8}[last.difficulty]||1;gap=prevGap*g.settings.revisionGrowth*factor*difficulty}
 gap=Scheduler.clamp(Math.round(gap),g.settings.revisionMinimum,g.settings.revisionMaximum);let due=gcmPlus(base,gap);const lastBefore=gcmPlus(g.settings.examDate,-1);return due>lastBefore?'':due}
function gcmReviewStatus(id){const d=gcmReviewDue(id);return !gcmState(id).studyDate?'Não estudado':!d?'Encerrado':d<gcmISO()?'Atrasada':d===gcmISO()?'Hoje':'Agendada'}
const gcmCard=(label,value,help,tone='')=>`<div class="card kpi gcm-kpi ${tone}"><div class="hint">${label}</div><strong class="num">${value}</strong><div class="foot">${help}</div></div>`;
function gcmBars(data,{color='#5148bc',suffix='',max=0}={}){const peak=max||Math.max(1,...data.map(x=>gcmN(x[1])));return `<div class="gcm-barset">${data.map(([name,v,col])=>`<div class="gcm-barline"><div class="row"><strong>${E(name)}</strong><span class="small num">${gcmFmt(v,Number.isInteger(v)?0:1)}${suffix}</span></div><div class="gcm-bartrack"><span style="width:${Math.min(100,100*gcmN(v)/peak)}%;background:${col||color}"></span></div></div>`).join('')}</div>`}
function gcmLine(values,label='Evolução',percent=false){const arr=values.slice(-13).map(x=>({...x,value:gcmN(x.value)})),w=560,h=200,p=26,max=Math.max(1,...arr.map(x=>x.value),percent?100:0),step=arr.length>1?(w-p*2)/(arr.length-1):0,points=arr.map((x,i)=>`${p+i*step},${h-p-(x.value/max)*(h-p*2)}`).join(' ');const marks=[0,.25,.5,.75,1].map(q=>`<line x1="${p}" y1="${p+q*(h-2*p)}" x2="${w-p}" y2="${p+q*(h-2*p)}" stroke="currentColor" opacity=".12"/>`).join('');return `<div class="gcm-chart" role="img" aria-label="${E(label)}"><svg viewBox="0 0 ${w} ${h}" aria-hidden="true" preserveAspectRatio="xMidYMid meet">${marks}${arr.length?`<polyline fill="none" stroke="var(--primary)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" points="${points}"/>`:''}${arr.map((x,i)=>`<circle cx="${p+i*step}" cy="${h-p-(x.value/max)*(h-p*2)}" r="4.4" fill="var(--primary)"><title>${E(x.label)}: ${gcmFmt(x.value,1)}${percent?'%':''}</title></circle>`).join('')}</svg><div class="gcm-axis"><span>${E(arr[0]?.label||'Sem dados')}</span><span>${E(arr.at(-1)?.label||'')}</span></div></div>`}
function gcmRing(v,caption='Concluído'){const p=Scheduler.clamp(v,0,1),r=73,c=2*Math.PI*r;return `<div class="gcm-ringrow"><svg width="184" height="184" viewBox="0 0 184 184" role="img" aria-label="${E(caption)}: ${gcmP(p)}"><circle cx="92" cy="92" r="73" stroke="var(--line)" stroke-width="17" fill="none"/><circle cx="92" cy="92" r="73" stroke="var(--primary)" stroke-linecap="round" stroke-width="17" fill="none" stroke-dasharray="${p*c} ${c}" transform="rotate(-90 92 92)"/><text x="92" y="85" text-anchor="middle" class="gcm-ringbig">${Math.round(p*100)}%</text><text x="92" y="109" text-anchor="middle" class="gcm-ringtiny">${E(caption)}</text></svg></div>`}
function gcmHeader(title,subtitle,extra=''){return `<div class="row gcm-sectionhead"><div><div class="eyebrow">GCM FIRMINO ALVES · 2026–27</div><h2>${E(title)}</h2><p class="muted">${subtitle}</p></div>${extra}</div>`}
function gcmOpen(tab){gcmTab=tab;navigate('gcm')}
function renderGCM(){const x=gcmDB();return `<div class="gcm-area"><section class="gcm-header"><div><div class="eyebrow">ESTUDAMENTE / EDIÇÃO CONCURSOS</div><h1>Seu centro de comando.</h1><p>Organize o estudo para a Guarda Municipal de Firmino Alves — sem perder as ferramentas científicas do EstudaMente.</p></div><div class="gcm-deadline"><small>Prova de referência</small><strong>${gcmDate(x.settings.examDate)}</strong><span>${Math.max(0,gcmCountdown())} dias restantes</span></div></section><div class="gcm-tabrail" role="navigation" aria-label="Módulos do plano de concurso">${GCM_TABS.map(([tab,ico,title])=>`<button type="button" class="gcm-tab ${gcmTab===tab?'sel':''}" data-act="gcmTab" data-value="${tab}" ${gcmTab===tab?'aria-current="page"':''}><span>${uiIcon(tab)}</span>${title}</button>`).join('')}</div><div class="stack gcm-body">${({painel:gcmDashboard,edital:gcmSyllabus,ciclo:gcmCycle,semanas:gcmWeeks,acompanhamento:gcmMonitoring,redacao:gcmEssays,revisoes:gcmRevisions,questoes:gcmQuestions,simulados:gcmMocks,materiais:gcmMaterials,bemestar:gcmWellness,log:gcmAmendments,config:gcmSettings}[gcmTab]||gcmDashboard)()}</div><p class="small gcm-disclaimer">Referência: planilha do usuário (122 unidades). Datas e metas podem ser ajustadas. Indicadores de retenção e espaçamento são heurísticos e não equivalem a probabilidade de aprovação. Todos os registros permanecem neste navegador; faça backup em Ajustes.</p></div>`}
function gcmDashboard(){const g=gcmDB(),s=gcmStat(),budget=gcmBudget(),week=gcmWeekKey(),weeks=Array.from({length:12},(_,i)=>{const key=gcmPlus(week,(i-11)*7);return {label:gcmDate(key).slice(0,6),value:gcmSumWeek(key)}}),qstats=GCM_SUBJECTS.map(z=>{const data=g.questionLogs.filter(x=>x.subject===z.name);const n=data.reduce((a,x)=>a+gcmN(x.questions),0),c=data.reduce((a,x)=>a+gcmN(x.correct),0);return [z.name,n?Math.round(c/n*100):0,z.color]});return `${gcmHeader('Visão geral','Uma leitura rápida do que já foi feito e do que precisa de atenção.',`<button class="btn secondary" data-act="gcmImport">⇣ Integrar o edital ao EstudaMente</button>`)}<div class="grid four">${gcmCard('Edital iniciado',Math.round(s.ratio*100)+'%',`${s.studied} de 122 unidades`)}${gcmCard('Horas da semana',gcmFmt(gcmSumWeek(),1)+'h',`Meta de ${gcmFmt(g.settings.weeklyHours)}h`)}${gcmCard('Questões resolvidas',gcmFmt(s.q.n),`${s.q.n?gcmP(s.q.c/s.q.n):'Sem dados'} de acertos`)}${gcmCard('Revisões atrasadas',s.overdue,`${s.r} sessões registradas`,s.overdue?'gcm-attention':'')}</div><div class="grid two"><section class="card"><div class="row"><h2>Seu edital em um círculo</h2><button class="why" data-act="gcmTab" data-value="edital">Abrir edital →</button></div>${gcmRing(s.ratio,'iniciado')}<p class="muted tinytext" style="text-align:center">${s.master} tópicos dominados · não é nota de prova</p></section><section class="card"><div class="row"><h2>Horas da semana por matéria</h2><button class="why" data-act="gcmTab" data-value="ciclo">Registrar horas →</button></div>${gcmBars(budget.map(x=>[x.name,gcmCycleDone(x.name),GCM_SUBJECTS.find(z=>z.name===x.name).color]),{max:Math.max(1,...budget.map(x=>x.hours)),suffix:' h'})}<div class="separator"></div><div class="small">Metas calculadas: ${budget.map(x=>`${x.name}: ${gcmFmt(x.hours,1)}h`).join(' · ')}</div></section></div><div class="grid two"><section class="card"><h2>Evolução das horas</h2><p class="small">Horas efetivamente marcadas no ciclo, por semana.</p>${gcmLine(weeks,'Horas estudadas nas últimas semanas')}</section><section class="card"><h2>Precisão em questões</h2><p class="small">Acertos ÷ questões registradas, por matéria. Sem dados = 0 na visualização.</p>${gcmBars(qstats,{max:100,suffix:'%'})}<div class="separator"></div><div class="row start"><button class="btn secondary" data-act="gcmTab" data-value="questoes">Registrar questões</button><button class="btn ghost" data-act="gcmTab" data-value="simulados">Analisar simulados</button></div></section></div><section class="card soft"><div class="row"><div><h3>Seu próximo movimento</h3><p class="muted" style="margin:0">${s.studied?'Revise os assuntos que já estudou e registre evidências reais de desempenho.':'Comece pelo edital, escolha um assunto e registre a primeira sessão.'}</p></div><div class="row start"><button class="btn" data-act="gcmTab" data-value="edital">Ver conteúdos →</button><button class="btn ghost" data-nav="estudar">Estudo guiado</button></div></div></section>`}
function gcmSyllabus(){const g=gcmDB(),stats=gcmStat(),list=GCM_SEED.units.filter(x=>(!gcmSubjectFilter||x.subject===gcmSubjectFilter)&&(!gcmStatusFilter||gcmState(x.code).status===gcmStatusFilter)&&(!gcmFind||(x.name+' '+x.group+' '+x.code).toLocaleLowerCase('pt-BR').includes(gcmFind.toLocaleLowerCase('pt-BR'))));return `${gcmHeader('Edital verticalizado','122 unidades distribuídas em três matérias. Marque sua situação e descubra onde concentrar esforço.',`<button class="btn secondary" data-act="gcmImport">Integrar ao estudo guiado</button>`)}<div class="grid three">${GCM_SUBJECTS.map(z=>{const all=GCM_SEED.units.filter(x=>x.subject===z.name),done=all.filter(x=>gcmState(x.code).status!=='Não iniciado').length;return `<div class="card"><div class="row"><strong><span class="subjectdot" style="background:${z.color}"></span> ${z.name}</strong><span class="chip">${done}/${all.length}</span></div><div class="progress" style="margin-top:15px"><span style="width:${100*done/all.length}%;background:${z.color}"></span></div><p class="small" style="margin:9px 0 0">${Math.round(100*done/all.length)}% com estudo iniciado</p></div>`}).join('')}</div><section class="card"><form id="gcmSearchForm" class="gcm-filters"><div class="field"><label for="gcmText">Buscar assunto</label><input id="gcmText" name="search" placeholder="Ex.: porcentagem, gramática, história…" value="${E(gcmFind)}"></div><div class="field"><label for="gcmSubject">Matéria</label><select id="gcmSubject" name="subject"><option value="">Todas</option>${GCM_SUBJECTS.map(s=>`<option ${gcmSubjectFilter===s.name?'selected':''}>${s.name}</option>`).join('')}</select></div><div class="field"><label for="gcmStatus">Situação</label><select id="gcmStatus" name="status"><option value="">Todos</option>${GCM_STATUSES.map(z=>`<option ${gcmStatusFilter===z?'selected':''}>${z}</option>`).join('')}</select></div><button class="btn secondary" type="submit">Filtrar</button><button class="btn ghost" data-act="gcmClearFilters" type="button">Limpar</button></form><p class="small">${list.length} de 122 unidades exibidas. Clique em um tópico para registrar data, qualidade e observações.</p><div class="gcm-unitlist">${list.map(x=>{const st=gcmState(x.code);return `<button class="gcm-unit" type="button" data-act="gcmUnit" data-id="${E(x.code)}"><span class="gcm-unitmark ${st.status==='Dominado'?'master':st.status==='Não iniciado'?'blank':'started'}">${st.status==='Dominado'?'✓':st.status==='Não iniciado'?'○':'◉'}</span><span class="gcm-unitbody"><strong>${E(x.name)}</strong><small>${E(x.subject)} · ${E(x.group)} · ${E(x.code)}</small></span><span class="chip ${st.status==='Dominado'?'green':st.status==='Em estudo'?'orange':''}">${E(st.status)}</span><span class="gcm-unitarrow">›</span></button>`}).join('')||'<div class="empty">Nenhum assunto corresponde aos filtros.</div>'}</div></section>`}
function gcmOpenUnit(id){const x=gcmObj(id);if(!x)return;const s=gcmState(id);modal(x.name,`<div class="small">${E(x.code)} · ${E(x.subject)} · ${E(x.group)}</div><p class="muted tinytext" style="margin:12px 0">Referência da planilha: ${E(x.origin||'Edital verticalizado')}</p><form id="gcmUnitForm" data-id="${E(id)}"><div class="field"><label>Situação</label><select name="status">${GCM_STATUSES.map(z=>`<option ${s.status===z?'selected':''}>${z}</option>`).join('')}</select></div><div class="fieldrow"><div class="field"><label>Primeiro estudo</label><input name="studyDate" type="date" value="${E(s.studyDate||'')}"></div><div class="field"><label>Qualidade das questões</label><select name="quality"><option value="">Não avaliada</option>${['Boa','Regular','Fraca'].map(x=>`<option ${s.quality===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="fieldrow"><div class="field"><label>Dificuldade (1–5)</label><input type="number" min="1" max="5" name="difficulty" value="${gcmN(s.difficulty)||3}"></div><div class="field"><label>Prioridade (1–5)</label><input type="number" min="1" max="5" name="priority" value="${gcmN(s.priority)||3}"></div></div><div class="field"><label>Observações</label><textarea name="notes" placeholder="Como foi a aprendizagem? Quais erros surgiram?">${E(s.notes||'')}</textarea></div><div class="row start"><button class="btn" type="submit">Salvar acompanhamento</button><button class="btn ghost" type="button" data-act="gcmStudyTopic" data-id="${E(id)}">Abrir no estudo guiado</button></div></form>`)}
function gcmCycle(){const g=gcmDB(),week=gcmWeekKey(),budget=gcmBudget();return `${gcmHeader('Ciclo de estudos','Você escolhe a ordem. Cada quadradinho representa até 1 hora e pode registrar meia hora.',`<span class="chip">Semana de ${gcmDate(week)}</span>`)}<div class="grid four">${gcmCard('Meta semanal',gcmFmt(g.settings.weeklyHours)+'h','Ajustável nas configurações')}${gcmCard('Já concluídas',gcmFmt(gcmSumWeek(),1)+'h','Somando as três matérias')}${gcmCard('Restante',gcmFmt(Math.max(0,g.settings.weeklyHours-gcmSumWeek()),1)+'h','Pode exceder a meta sem bloquear')}${gcmCard('Percentual',gcmP(gcmSumWeek()/Math.max(1,g.settings.weeklyHours)),'Horas marcadas ÷ meta semanal')}</div><div class="alert info">As metas reproduzem a divisão inicial da planilha: aproximadamente 9h de Português, 21,5h de Matemática e 21,5h de Conhecimentos Gerais. Os pesos da prova (40/30/30) são mostrados separadamente. Essa distribuição é uma regra configurável, não um tempo cientificamente ótimo.</div>${budget.map(s=>{const vals=gcmCycleVals(s.name),done=gcmCycleDone(s.name),slots=Math.max(1,Math.ceil(s.hours));return `<section class="card gcm-cyclecard"><div class="row"><div><h2><span class="subjectdot" style="background:${GCM_SUBJECTS.find(x=>x.name===s.name).color}"></span> ${E(s.name)}</h2><div class="small">Meta sugerida ${gcmFmt(s.hours,1)}h · alocação relativa ${gcmP(s.allocation)} · dificuldade ${s.diff}/5</div></div><div class="gcm-cyclebig">${gcmFmt(done,1)} <span>/ ${gcmFmt(s.hours,1)} h</span></div></div><div class="progress" style="margin:16px 0"><span style="width:${Math.min(100,100*done/Math.max(1,s.hours))}%;background:${GCM_SUBJECTS.find(x=>x.name===s.name).color}"></span></div><div class="gcm-squares">${Array.from({length:slots},(_,i)=>{const val=gcmN(vals[i]);return `<button type="button" class="gcm-square ${val===1?'full':val===.5?'half':''}" data-act="gcmSquare" data-id="${E(s.name)}" data-value="${i}" title="Hora ${i+1}: ${val===1?'1h':val===.5?'30min':'0h'}; clique para alternar 0 → 30min → 1h">${val===1?'✓':val===.5?'½':i+1}</button>`}).join('')}</div><div class="row start" style="margin-top:14px"><button class="btn secondary tiny" data-act="gcmAddHour" data-id="${E(s.name)}" data-value="0.5">+ 30 min</button><button class="btn secondary tiny" data-act="gcmAddHour" data-id="${E(s.name)}" data-value="1">+ 1h</button><button class="btn ghost tiny" data-act="gcmAddHour" data-id="${E(s.name)}" data-value="-0.5">− 30 min</button><span class="small">Toque em cada bloco para corrigir seu registro.</span></div></section>`}).join('')}<section class="card soft"><div class="row"><div><h3>Fechamento da semana</h3><p class="small">As horas marcadas são contabilizadas automaticamente no painel. Você também pode anotar os assuntos trabalhados no cronograma.</p></div><button class="btn ghost" data-act="gcmTab" data-value="semanas">Abrir cronograma semanal →</button></div></section>`}
function gcmWeeks(){const g=gcmDB(),start=g.settings.startDate;const count=Math.max(13,Math.ceil(Math.max(0,Scheduler.daysBetween(Scheduler.local(g.settings.planningDeadline),Scheduler.local(start)))/7));const rows=Array.from({length:Math.min(30,count)},(_,i)=>{const day=gcmPlus(start,7*i),week=gcmMonday(day),data=g.weeks[week]||{},done=gcmSumWeek(week),now=week===gcmWeekKey();return `<button type="button" class="gcm-week ${now?'current':''}" data-act="gcmEditWeek" data-id="${week}"><span class="gcm-weeknumber">${String(i+1).padStart(2,'0')}</span><span class="gcm-weekmain"><strong>Semana ${i+1} ${now?'<span class="chip green">Atual</span>':''}</strong><span class="small">${gcmDate(day)} — ${gcmDate(gcmPlus(day,6))}</span><span class="gcm-weektopics">${GCM_SUBJECTS.map(x=>`${x.name}: ${E((data[x.name]||'A definir').slice(0,68))}`).join(' · ')}</span></span><span class="gcm-weekdone">${gcmFmt(done,1)}h <small>registradas</small></span><span>›</span></button>`}).join('');const points=Array.from({length:Math.min(30,count)},(_,i)=>{const week=gcmMonday(gcmPlus(start,i*7));return {label:`S${i+1}`,value:gcmSumWeek(week)}});return `${gcmHeader('Cronograma semanal','Organize os assuntos por semana, mas permita que um tema continue enquanto for necessário.') }<section class="card"><h2>Horas por semana</h2>${gcmLine(points.slice(-13),'Horas registradas no cronograma')}<p class="small">A curva reflete os registros do ciclo de horas. Sem registros, a semana aparece zerada.</p></section><section class="card"><div class="row"><h2>Planejamento e execução</h2><span class="chip">${Math.min(count,30)} semanas</span></div><p class="muted tinytext">Clique numa semana para definir os tópicos que pretende estudar. A carga concluída vem dos registros reais do ciclo.</p>${rows}</section>`}
function gcmEditWeek(week){const g=gcmDB(),w=g.weeks[week]||{};modal('Planejar semana · '+gcmDate(week),`<form id="gcmWeekForm" data-id="${E(week)}"><p class="small">Escreva os assuntos em andamento. Não é obrigatório encerrar tudo na mesma semana.</p>${GCM_SUBJECTS.map(s=>`<div class="field"><label>${E(s.name)}</label><textarea name="${E(s.name)}" rows="2" placeholder="O que estudar nesta matéria?">${E(w[s.name]||'')}</textarea></div>`).join('')}<div class="field"><label>Observações e ajustes</label><textarea name="notes" rows="2">${E(w.notes||'')}</textarea></div><p class="alert info">${gcmFmt(gcmSumWeek(week),1)} horas registradas nesta semana no ciclo de estudos.</p><button class="btn" type="submit">Salvar planejamento</button></form>`)}
function gcmRevisions(){const g=gcmDB(),items=GCM_SEED.units.map(u=>({u,s:gcmState(u.code),due:gcmReviewDue(u.code),status:gcmReviewStatus(u.code)})).filter(x=>x.s.studyDate),urgent=items.filter(x=>x.status==='Atrasada'||x.status==='Hoje').sort((a,b)=>a.due.localeCompare(b.due)),next=items.filter(x=>x.status==='Agendada').sort((a,b)=>a.due.localeCompare(b.due)),recent=[...g.reviews].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,12);return `${gcmHeader('Revisões espaçadas','Datas estimadas a partir do primeiro estudo e corrigidas pelo desempenho registrado.',`<button class="btn" data-act="gcmNewReview">+ Registrar revisão</button>`)}<div class="grid three">${gcmCard('Atrasadas',items.filter(x=>x.status==='Atrasada').length,'Precisam de atenção, mas atraso não é erro')}${gcmCard('Para hoje',items.filter(x=>x.status==='Hoje').length,'Pratique recuperação antes de consultar')}${gcmCard('Programadas',next.length,'Próximas revisões do plano')}</div><div class="alert info">A regra da planilha usa um intervalo inicial proporcional ao tempo até o prazo, crescimento ajustável e desempenho nas revisões. É uma <strong>heurística de planejamento</strong>; o agendador adaptativo original do EstudaMente continua disponível no Calendário.</div><div class="grid two"><section class="card"><div class="row"><h2>Hoje e atrasadas</h2><span class="chip orange">${urgent.length}</span></div>${urgent.length?urgent.slice(0,50).map(x=>`<div class="listline"><div class="row"><div><strong>${E(x.u.name)}</strong><div class="small">${E(x.u.subject)} · prevista ${gcmDate(x.due)}</div></div><button class="btn tiny secondary" data-act="gcmNewReview" data-id="${E(x.u.code)}">Registrar</button></div></div>`).join(''):'<div class="empty">Nenhuma revisão vencida. Comece registrando o estudo de um tópico no edital.</div>'}</section><section class="card"><h2>Próximas revisões</h2>${next.length?next.slice(0,16).map(x=>`<div class="listline row"><div><strong>${E(x.u.name)}</strong><div class="small">${E(x.u.subject)} · ${gcmDate(x.due)}</div></div><button class="btn ghost tiny" data-act="gcmNewReview" data-id="${E(x.u.code)}">Concluir</button></div>`).join(''):'<div class="empty">Sem revisões agendadas após hoje.</div>'}</section></div><section class="card"><div class="row"><h2>Registro de revisões</h2><span class="small">${g.reviews.length} sessões</span></div>${recent.length?`<div class="tablewrap"><table><thead><tr><th>Data</th><th>Assunto</th><th>Questões</th><th>Acertos</th><th>Desempenho</th><th></th></tr></thead><tbody>${recent.map(x=>`<tr><td>${gcmDate(x.date)}</td><td>${E(gcmObj(x.unitId)?.name||'Assunto excluído')}</td><td>${x.questions}</td><td>${x.correct}</td><td>${x.questions?gcmP(x.correct/x.questions):'Sem questões'}</td><td><button class="btn tiny danger" data-act="gcmDelete" data-value="reviews" data-id="${x.id}">Excluir</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Nenhuma revisão registrada ainda.</p>'}</section>`}
function gcmNewReview(id=''){const studied=GCM_SEED.units.filter(u=>gcmState(u.code).studyDate);modal('Registrar revisão real',`<form id="gcmReviewForm"><div class="field"><label>Assunto revisado</label><select name="unitId" required><option value="">Selecione o tópico</option>${studied.map(x=>`<option value="${x.code}" ${id===x.code?'selected':''}>${E(x.subject)} · ${E(x.name)}</option>`).join('')}</select></div><div class="fieldrow"><div class="field"><label>Data real</label><input name="date" type="date" required value="${gcmISO()}"></div><div class="field"><label>Tempo (minutos)</label><input name="minutes" type="number" min="0" max="1000" value="20"></div></div><div class="fieldrow"><div class="field"><label>Questões resolvidas</label><input name="questions" type="number" min="0" max="10000" required value="10"></div><div class="field"><label>Acertos</label><input name="correct" type="number" min="0" max="10000" required value="0"></div></div><div class="field"><label>Dificuldade percebida</label><select name="difficulty"><option>Fácil</option><option selected>Média</option><option>Difícil</option></select></div><div class="field"><label>Erros e observações</label><textarea name="notes" placeholder="O que errou? Qual foi a explicação correta?"></textarea></div><button class="btn" type="submit" ${studied.length?'':'disabled'}>Salvar revisão</button>${studied.length?'':'<p class="alert">Marque a data do primeiro estudo no Edital antes de registrar revisões.</p>'}</form>`)}
function gcmQuestions(){const g=gcmDB(),q=gcmStat().q;const sums=GCM_SUBJECTS.map(x=>{const items=g.questionLogs.filter(l=>l.subject===x.name);return [x.name,items.reduce((n,t)=>n+gcmN(t.questions),0),items.reduce((n,t)=>n+gcmN(t.correct),0),items.reduce((n,t)=>n+gcmN(t.cards),0)]});return `${gcmHeader('Questões e cards','Anote resultados reais de exercícios avulsos e sua produção de cards no Anki.',`<button class="btn" data-act="gcmNewQ">+ Registrar sessão</button>`)}<div class="grid three">${gcmCard('Questões feitas',q.n,'Somatório de exercícios avulsos')}${gcmCard('Aproveitamento',q.n?gcmP(q.c/q.n):'—','Acertos ÷ questões realizadas')}${gcmCard('Cards realizados',q.cards,'Cards de Anki registrados')}</div><div class="grid two"><section class="card"><h2>Questões por matéria</h2>${gcmBars(sums.map(([n,q])=>[n,q,GCM_SUBJECTS.find(x=>x.name===n).color]))}</section><section class="card"><h2>Taxa de acerto por matéria</h2>${gcmBars(sums.map(([n,q,c])=>[n,q?100*c/q:0,GCM_SUBJECTS.find(x=>x.name===n).color]),{max:100,suffix:'%'})}</section></div><section class="card"><h2>Histórico</h2>${g.questionLogs.length?`<div class="tablewrap"><table><thead><tr><th>Data</th><th>Matéria</th><th>Questões</th><th>Acertos</th><th>%</th><th>Cards</th><th>Ações</th></tr></thead><tbody>${[...g.questionLogs].reverse().map(x=>`<tr><td>${gcmDate(x.date)}</td><td>${E(x.subject)}</td><td>${x.questions}</td><td>${x.correct}</td><td>${x.questions?gcmP(x.correct/x.questions):'—'}</td><td>${x.cards}</td><td><button class="btn tiny ghost" data-act="gcmNewQ" data-id="${x.id}">Editar</button> <button class="btn tiny danger" data-act="gcmDelete" data-value="questionLogs" data-id="${x.id}">Excluir</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Registre sua primeira lista de questões ou produção de cards.</div>'}<button class="btn ghost" data-nav="estudar" style="margin-top:15px">Abrir o treino guiado do EstudaMente →</button></section>`}
function gcmNewQuestion(id=''){const x=gcmDB().questionLogs.find(z=>z.id===id)||{};modal(id?'Editar sessão':'Registrar questões e Anki',`<form id="gcmQuestionForm" data-id="${E(id)}"><div class="fieldrow"><div class="field"><label>Data</label><input name="date" type="date" required value="${E(x.date||gcmISO())}"></div><div class="field"><label>Matéria</label><select name="subject">${GCM_SUBJECTS.map(z=>`<option ${x.subject===z.name?'selected':''}>${z.name}</option>`).join('')}</select></div></div><div class="fieldrow"><div class="field"><label>Questões feitas</label><input name="questions" type="number" min="0" max="100000" required value="${x.questions??10}"></div><div class="field"><label>Acertos</label><input name="correct" type="number" min="0" max="100000" required value="${x.correct??0}"></div></div><div class="field"><label>Cards Anki feitos</label><input name="cards" type="number" min="0" max="100000" value="${x.cards??0}"></div><div class="field"><label>Observações</label><textarea name="notes">${E(x.notes||'')}</textarea></div><button class="btn" type="submit">Salvar registro</button></form>`)}
function gcmMocks(){const g=gcmDB();const exams=[...g.mockExams].sort((a,b)=>a.date.localeCompare(b.date)),recent=[...exams].reverse(),points=exams.map((x,i)=>({label:'S'+(i+1),value:x.total?100*x.correct/x.total:0}));const weighted=x=>GCM_SUBJECTS.reduce((sum,z)=>{const p=x.bySubject?.[z.name],den=gcmN(p?.questions),correct=gcmN(p?.correct);return sum+(den?g.settings.weights[z.name]*correct/den*100:0)},0);return `${gcmHeader('Simulados','Evolução por prova completa e leitura ponderada por matéria.',`<button class="btn" data-act="gcmNewMock">+ Adicionar simulado</button>`)}<div class="grid three">${gcmCard('Simulados registrados',exams.length,'Apenas provas concluídas')}${gcmCard('Último resultado',exams.length?gcmP(exams.at(-1).correct/Math.max(1,exams.at(-1).total)):'—','Acertos ÷ total no último simulado')}${gcmCard('Melhor resultado',exams.length?gcmP(Math.max(...exams.map(x=>x.correct/Math.max(1,x.total)))):'—','Maior percentual observado')}</div><div class="grid two"><section class="card"><h2>Evolução dos simulados</h2>${gcmLine(points,'Aproveitamento dos simulados',true)}<p class="small">Porcentagem de acertos no simulado inteiro.</p></section><section class="card"><h2>Pontos ponderados (referência)</h2><p class="small">Calcula 40% Português, 30% Matemática, 30% Conhecimentos Gerais quando cada bloco foi registrado.</p>${gcmBars(exams.slice(-8).map((x,i)=>[`Simulado ${exams.length-Math.min(8,exams.length)+i+1}`,weighted(x)]),{max:100,suffix:'/100'})}<p class="small">A ausência de resultados por matéria não é preenchida com valores inventados.</p></section></div><section class="card"><h2>Histórico de provas</h2>${recent.length?`<div class="tablewrap"><table><thead><tr><th>Data</th><th>Fonte/Banca</th><th>Duração</th><th>Questões</th><th>Acertos</th><th>%</th><th>Ponderada</th><th></th></tr></thead><tbody>${recent.map(x=>`<tr><td>${gcmDate(x.date)}</td><td>${E(x.source)}</td><td>${x.duration} min</td><td>${x.total}</td><td>${x.correct}</td><td>${gcmP(x.correct/ const _gcmSanitizeBeforeStudio4 = sanitizeImport;
sanitizeImport = function(obj){const clean=_gcmSanitizeBeforeStudio4(obj);if(obj?.gcm&&typeof obj.gcm==='object'&&!Array.isArray(obj.gcm))clean.gcm=JSON.parse(JSON.stringify(obj.gcm));return clean};
const _gcmDB_beforeStudio4 = gcmDB;
gcmDB = function(){
  const g=_gcmDB_beforeStudio4();

    for(const [week,cols] of Object.entries(g.cycles||{})){
      if(!/^\d{4}-\d\d-\d\d$/.test(week))continue;
      for(const s of GCM_SUBJECTS){
        const values=Array.isArray(cols?.[s.name])?cols[s.name]:[];

function gcmQuickChecklist(){const done=GCM_SEED.units.filter(u=>gcmIsCompleted(u.code)).length,started=GCM_SEED.units.filter(u=>gcmState(u.code).status==='Em estudo').length;return `<div class="row"><strong>Checklist sincronizado</strong><span class="chip">${done}/122 concluídos · ${started} em andamento</span></div><p class="small">Marque um assunto como Estudado e informe a data de conclusão: a revisão e o cronograma serão atualizados automaticamente.</p><button class="btn secondary" data-act="gcmTab" data-value="edital">Abrir checklist →</button>`}
gcmCycle=function(){

<button class="btn tiny ghost" data-act="gcmEditLog" data-id="${E(l.id)}">Editar</button><button class="btn tiny danger" data-act="gcmDeleteLog" data-id="${E(l.id)}">×</button></div></div>`}).join('')||'<div class="empty">Nenhuma hora registrada. Cadastre seu primeiro estudo.</div>'}</section>`;
};
gcmOpenUnit=function(id){
 const u=gcmObj(id);if(!u)return;const st=gcmState(id),baseline=gcmOriginalTarget(id),hours=gcmStudyLogs().filter(x=>x.unitId===id).reduce((a,x)=>a+gcmN(x.minutes)/60,0),finished=gcmCompletionDate(id);
 let deviation='Aguardando conclusão';if(finished&&baseline){const delta=Math.round(Scheduler.daysBetween(Scheduler.local(finished),Scheduler.local(baseline)));deviation=delta>0?`${delta} dia(s) depois do prazo original`:delta<0?`${-delta} dia(s) antes do prazo original`:'Concluído na data planejada';}

gcmWeeks=function(){
 const g=gcmDB(),plan=gcmSchedule(),now=gcmWeekKey(),from=gcmMonday(g.settings.startDate),last=gcmMonday(g.settings.planningDeadline);
 const allWeeks=[];for(let w=from;w<=last&&allWeeks.length<110;w=gcmPlus(w,7))allWeeks.push(w);
 const completed=GCM_SEED.units.filter(u=>gcmIsCompleted(u.code));const offsets=completed.map(u=>Math.round(Scheduler.daysBetween(Scheduler.local(gcmCompletionDate(u.code)),Scheduler.local(gcmOriginalTarget(u.code))))).filter(Number.isFinite);
 const early=offsets.filter(x=>x<0).length,late=offsets.filter(x=>x>0).length;
 return `${gcmHeader('Cronograma semanal adaptativo','O algoritmo distribui carga por assunto e complexidade, não por quantidade de tópicos. Finalizações antecipadas ou atrasadas recalculam as semanas abertas.',`<button class="btn" data-act="gcmTab" data-value="ciclo">Registrar horas →</button>`)}<div class="grid four">${gcmCard('Semanas até o prazo',plan.weekKeys.length,'Planejamento restante')}${gcmCard('Concluídos antes do previsto',early,'Comparação com marco original')}${gcmCard('Concluídos depois do previsto',late,'Comparação com marco original')}${gcmCard('Assuntos pendentes',122-completed.length,'Todas as matérias')}</div><div class="alert info"><strong>Replanejamento automático:</strong> terminar antes libera tempo para aprofundar os demais assuntos; atrasar exige redistribuição. O sistema redistribui a capacidade entre disciplinas para tentar finalizar todas até o prazo. O peso das questões continua orientando como distribuir as horas que sobram. O tempo indicado é uma estimativa de organização, não uma previsão validada de aprendizagem.</div>${Object.values(plan.diagnostics).some(x=>x.shortage>.2)?`<div class="alert">Atenção: o esforço-base de alguns tópicos excede a janela de tempo reservada para conteúdo novo. Ajuste as horas semanais, a reserva ou o prazo nas configurações. O sistema não esconde esse déficit.</div>`:''}<div class="studio-weekgrid">${allWeeks.map((week,index)=>{const r=plan.weeks[week],past=week<now,current=week===now,weekHours=gcmSumWeek(week),end=gcmPlus(week,6);return `<section class="card studio-weekcard ${current?'studio-currentweek':''}"><div class="studio-weekhead"><div><span class="chip ${current?'green':''}">Semana ${index+1} ${current?'· atual':past?'· histórica':'· prevista'}</span><h3>${gcmDate(week)} — ${gcmDate(end)}</h3></div><div class="studio-week-hours">${gcmFmt(weekHours,1)}h <span>feitas</span></div></div>${GCM_SUBJECTS.map(sub=>{const rec=r?.subjects[sub.name],target=gcmBudget().find(x=>x.name===sub.name),actual=gcmCycleDone(sub.name,week),topicHtml=rec?.tasks?.length?rec.tasks.map(x=>`<li><strong>${E(x.name)}</strong> <span>${gcmFmt(x.hours,1)}h</span></li>`).join(''):(past?'Histórico registrado no diário':'Sem conteúdo pendente ou tempo livre para revisar');return `<div class="studio-week-sub"><div class="row"><strong style="color:${sub.color}">${E(sub.name)}</strong><span class="small">${gcmFmt(actual,1)}h realizadas · ${gcmFmt(rec?.hours||0,1)}h de conteúdo planejado · meta-base ${gcmFmt(target.hours,1)}h</span></div>${rec?.tasks?.length?`<ul>${topicHtml}</ul>`:`<p class="small">${topicHtml}</p>`}</div>`}).join('')}<button class="btn tiny ghost" data-act="gcmEditWeek" data-id="${E(week)}">Notas desta semana →</button></section>`}).join('')||'<div class="empty">Seu prazo de planejamento já terminou. Defina uma nova data em Configurações.</div>'}</div>`;
};
function gcmMonitoring(){const hours=gcmStudyHours('',gcmPeriodBounds()),budget=gcmBudget(),bounds=gcmPeriodBounds(),rows=budget.map(x=>({name:x.name,color:x.color,value:gcmStudyHours(x.name,bounds)})),logs=gcmStudyLogs(bounds).slice().sort((a,b)=>b.date.localeCompare(a.date));const days=new Set(logs.map(l=>l.date)).size;
 return `${gcmHeader('Acompanhamento de horas','Quanto você efetivamente estudou, por matéria e tipo de estudo, no período escolhido.',`<button class="btn" data-act="gcmNewLog">+ Registrar horas</button>`)}${gcmRangeControls()}<div class="grid three">${gcmCard('Horas realizadas',gcmFmt(hours,1)+'h','No período selecionado')}${gcmCard('Dias com registros',days,'Não são dias presumidos')}${gcmCard('Sessões documentadas',logs.length,'Pode editar ou excluir')}</div><div class="grid two"><section class="card"><h2>Divisão real por matéria</h2>${gcmPie(rows,'HORAS',gcmFmt(hours,1)+'h')}</section><section class="card"><h2>Horas por matéria</h2>${gcmBars(rows.map(x=>[x.name,x.value,x.color]),{suffix:' h'})}<p class="small">Dados reais do diário; compare com a alocação no ciclo.</p></section></div>${gcmOverviewCharts()}<section class="card"><h2>Registros do período</h2>${logs.slice(0,50).map(x=>`<div class="studio-log"><span class="studio-log-date">${gcmDate(x.date)}</span><div class="grow"><strong>${E(x.subject)} · ${gcmFmt(x.minutes/60,2)}h</strong><div class="small">${E(x.method)}${x.unitId?' · '+E(gcmObj(x.unitId)?.name||''):''}</div></div><button class="btn tiny ghost" data-act="gcmEditLog" data-id="${E(x.id)}">Editar</button></div>`).join('')||'<div class="empty">Sem sessões no intervalo selecionado.</div>'}</section>`;

function gcmExportRevisionsICS(){const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//EstudaMente Studio//Revisoes GCM//PT-BR','CALSCALE:GREGORIAN','METHOD:PUBLISH'];for(const u of GCM_SEED.units){const due=gcmReviewDue(u.code);if(!due)continue;const next=gcmPlus(due,1),dt=due.replaceAll('-',''),en=next.replaceAll('-','');lines.push('BEGIN:VEVENT','UID:estudamente-gcm-'+u.code+'-'+dt+'@offline','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'').replace('.',''),'DTSTART;VALUE=DATE:'+dt,'DTEND;VALUE=DATE:'+en,'SUMMARY:'+icsSafe('Revisar '+u.name),'DESCRIPTION:'+icsSafe(u.subject+' · Revisão prevista pelo EstudaMente; confirme depois do estudo.'),'END:VEVENT')}lines.push('END:VCALENDAR');makeDownload('estudamente-revisoes-gcm-'+gcmISO()+'.ics',lines.join('\r\n')+'\r\n','text/calendar;charset=utf-8');toast('Calendário .ics exportado. Importe-o no Google Agenda.');}
