const _gcmSubmitLegacy=gcmHandleSubmit;
gcmHandleSubmit=function(f){
 if(!f.id.startsWith('gcm'))return false;
 const g=gcmDB(),v=Object.fromEntries(new FormData(f).entries());
 const fail=msg=>{toast(msg);return true};
 const finish=msg=>{save();if(document.getElementById('modal').open)closeModal();render();toast(msg);return true};
 const safeDate=x=>/^\d{4}-\d{2}-\d{2}$/.test(String(x||''))&&!Number.isNaN(Scheduler.local(x).getTime());
 if(f.id==='gcmPeriodForm'){if(!['semana','mes','ano','total','custom'].includes(v.period))return fail('Período inválido');if(v.period==='custom'&&(!safeDate(v.from)||!safeDate(v.to)||v.from>v.to))return fail('Informe um intervalo válido.');gcmPeriod=v.period;gcmRangeStart=v.from;gcmRangeEnd=v.to;render();return true}
 if(f.id==='gcmStudyLogForm'){
  const minutes=Math.round(Number(v.hours)*60+Number(v.minutes));if(!safeDate(v.date)||v.date>gcmISO()||!GCM_SUBJECTS.some(x=>x.name===v.subject)||!Number.isFinite(minutes)||minutes<=0||minutes>1440)return fail('Informe uma data válida e duração entre 1 minuto e 24 horas.');
  const u=v.unitId?gcmObj(v.unitId):null;if(u&&u.subject!==v.subject)return fail('O assunto precisa pertencer à matéria selecionada.');
  const existing=g.studyLogs.find(x=>x.id===f.dataset.id);if(existing&&existing.id.startsWith('migrado-'))return fail('O registro importado do ciclo anterior está protegido; crie outro lançamento para ajustes.');
  const item={id:existing?.id||mkId(),date:v.date,subject:v.subject,unitId:u?.code||'',minutes,method:GCM_METHODS.includes(v.method)?v.method:'Outro',notes:String(v.notes||'').slice(0,2000)};
  if(existing)Object.assign(existing,item);else g.studyLogs.push(item);
  if(u){const st=g.unitState[u.code]||{...gcmState(u.code)};if(st.status==='Não iniciado')st.status='Em estudo';if(!st.studyDate||v.date<st.studyDate)st.studyDate=v.date;g.unitState[u.code]=st}
  return finish('Estudo registrado; metas, gráficos e cronograma sincronizados.');
 }
 if(f.id==='gcmUnitSmartForm'){
  const u=gcmObj(f.dataset.id);if(!u)return fail('Assunto inválido.');
  const status=GCM_STATUSES.includes(v.status)?v.status:'Não iniciado',isDone=['Estudado','Dominado'].includes(status);
  const init=v.studyDate||((status!=='Não iniciado')?gcmISO():''),end=isDone?(v.completedDate||gcmISO()):'';
  if(init&&!safeDate(init)||end&&!safeDate(end)||init&&end&&end<init||end&&end>gcmISO())return fail('Confira a data de início e a data de conclusão.');
  const h=Number(v.logHours||0),m=Number(v.logMinutes||0),addMin=Math.round(h*60+m);
  if(!Number.isInteger(h)||h<0||h>24||!Number.isInteger(m)||m<0||m>59||addMin>1440||addMin<0)return fail('Verifique as horas e os minutos do registro.');
  if(addMin>0&&(!safeDate(v.logDate)||v.logDate>gcmISO()))return fail('Informe uma data válida para as horas estudadas.');
  g.unitState[u.code]={...gcmState(u.code),status,studyDate:init,completedDate:end,priority:Scheduler.clamp(gcmN(v.priority)||3,1,5),difficulty:Scheduler.clamp(gcmN(v.difficulty)||3,1,5),estimatedHours:v.estimatedHours?Scheduler.clamp(gcmN(v.estimatedHours),.5,120):null,notes:String(v.notes||'').slice(0,2500)};
  if(addMin>0){g.studyLogs.push({id:mkId(),date:v.logDate,subject:u.subject,unitId:u.code,minutes:addMin,method:GCM_METHODS.includes(v.logMethod)?v.logMethod:'Não definido',notes:'Adicionado junto à atualização do checklist'});if(!g.unitState[u.code].studyDate||v.logDate<g.unitState[u.code].studyDate)g.unitState[u.code].studyDate=v.logDate;}

  return finish(isDone?'Concluído! Revisão e cronograma atualizados.':'Status atualizado; cronograma recalculado.');
 }
 if(f.id==='gcmEssayForm'){
   const score=Number(v.score),minutes=Number(v.minutes);if(!safeDate(v.date)||v.date>gcmISO()||!v.theme?.trim()||!Number.isFinite(score)||score<0||score>1000||!Number.isFinite(minutes)||minutes<0||minutes>1440)return fail('Revise data, tema, nota e duração.');
   const id=mkId();g.essays.push({id,date:v.date,theme:v.theme.trim().slice(0,160),score,minutes,notes:String(v.notes||'').slice(0,3000)});if(minutes>0)g.studyLogs.push({id:'essaytime-'+id,date:v.date,subject:'Português',unitId:'',minutes,method:'Redação',notes:'Tempo importado da aba Redação: '+v.theme.trim().slice(0,150)});
   return finish('Redação adicionada ao acompanhamento.');
 }
 if(f.id==='gcmStudioSettingsForm'){
  if(![v.startDate,v.examDate,v.planningDeadline].every(safeDate)||v.planningDeadline<v.startDate||v.planningDeadline>v.examDate)return fail('O prazo do conteúdo deve estar entre o início do plano e a prova.');
  const h=Number(v.weeklyHours),frac=Number(v.revisionFraction),growth=Number(v.revisionGrowth),rmin=Number(v.revisionMinimum),rmax=Number(v.revisionMaximum);if(!(h>0&&h<=140&&frac>=1&&frac<=50&&growth>=1&&growth<=5&&rmin>=1&&rmax>=rmin&&rmax<=365))return fail('Confira horas semanais e parâmetros de revisão.');
  const qc={},pw={},diff={};let filled=0,invalid=false;
  GCM_SUBJECTS.forEach((s,i)=>{const raw=v['questions'+i],q=raw===''?0:Number(raw),p=Number(v['point'+i]),d=Number(v['diff'+i]);if(!Number.isInteger(q)||q<0||q>1000||!(p>=.1&&p<=20)||!(d>=1&&d<=5))invalid=true;qc[s.name]=q;pw[s.name]=p;diff[s.name]=d;if(q>0)filled++});
  if(invalid||filled>0&&filled<3)return fail('Informe a quantidade de questões de todas as três disciplinas, ou deixe as três em branco.');
  g.settings={...g.settings,startDate:v.startDate,examDate:v.examDate,planningDeadline:v.planningDeadline,weeklyHours:h,questionCount:qc,pointWeight:pw,difficulty:diff,contentShare:Scheduler.clamp(Number(v.contentShare)||.75,.6,.9),revisionFraction:frac/100,revisionGrowth:growth,revisionMinimum:rmin,revisionMaximum:rmax};
  return finish('Metas, cronograma e revisões recalculados.');
 }
 return _gcmSubmitLegacy(f);
};


/* EstudaMente Studio 4.2 — motor transparente do ciclo. Usa os mesmos dados da versão 4.1. */
function gcmCycleCompute({hours,counts,points,difficulty,allocation}) {
  const h=Number(hours);
  const complete=GCM_SUBJECTS.every(s=>Number(counts[s.name])>0);
  const vals=GCM_SUBJECTS.map(s=>{
    const official=complete?Number(counts[s.name]):Number(allocation?.[s.name]||0);
    const p=Number(points[s.name])||1;
    const d=Scheduler.clamp(Number(difficulty[s.name])||3,1,5);
    const difficultyFactor=1+(d-3)*.10; // de 0,8 a 1,2, parâmetro transparente de organização
    const examRaw=official*p;
    return {name:s.name,color:s.color,questions:complete?official:null,pointWeight:p,diff:d,difficultyFactor,examRaw,raw:examRaw*difficultyFactor};
  });
  const total=vals.reduce((n,x)=>n+x.raw,0)||1;
  const examTotal=vals.reduce((n,x)=>n+x.examRaw,0)||1;
  const halfHours=Math.max(0,Math.round(h*2));
  const rows=vals.map(x=>({...x,examShare:x.examRaw/examTotal,weightedShare:x.raw/total,
    exact:halfHours*x.raw/total,half:Math.floor(halfHours*x.raw/total)}));
  let left=halfHours-rows.reduce((a,x)=>a+x.half,0);
  // Quando duas disciplinas têm o mesmo escore, preferir metas iguais se a granularidade permitir.
  const groups=[];
  rows.forEach((x,i)=>{let group=groups.find(g=>Math.abs(g.raw-x.raw)<1e-8);if(!group){group={raw:x.raw,ids:[],rem:x.exact-x.half};groups.push(group)}group.ids.push(i)});
  groups.sort((a,b)=>Math.abs(b.rem-a.rem)>1e-7?b.rem-a.rem:b.ids.length-a.ids.length);
  for(const group of groups){if(left>=group.ids.length&&group.rem>1e-9){group.ids.forEach(i=>rows[i].half++);left-=group.ids.length}}
  if(left>0)rows.map((x,i)=>({i,rem:x.exact-x.half})).filter(x=>rows[x.i].half<Math.ceil(rows[x.i].exact)).sort((a,b)=>b.rem-a.rem||a.i-b.i).slice(0,left).forEach(x=>rows[x.i].half++);
  rows.forEach(x=>{x.hours=x.half/2;x.share=halfHours?x.half/halfHours:0;x.weight=x.pointWeight;x.allocation=x.share});
  return {rows,useCounts:complete,totalHours:halfHours/2};
}
// Fontes distintas: peso e quantidade vêm do edital (informados pelo estudante);
// dificuldade vem da avaliação pessoal. Sem números oficiais, permanece explícita a base provisória.
gcmWeightedHours=function(){
  const g=gcmDB(),s=g.settings;
  const r=gcmCycleCompute({hours:s.weeklyHours,counts:s.questionCount||{},points:s.pointWeight||{},
    difficulty:s.difficulty||{},allocation:s.allocation||{}});
  const first=gcmMonday(gcmISO())>gcmMonday(s.startDate)?gcmMonday(gcmISO()):gcmMonday(s.startDate);
  const end=gcmMonday(s.planningDeadline);let weeks=0;
  for(let w=first;w<=end&&weeks<110;w=gcmPlus(w,7))weeks++;
  r.weeks=Math.max(1,weeks);
  // O cronograma usa uma previsão separada de horas para finalizar assuntos pendentes.
  const logs=gcmStudyLogs();
  r.rows=r.rows.map(x=>{
    const effort=GCM_SEED.units.filter(u=>u.subject===x.name&&!gcmIsCompleted(u.code)).reduce((n,u)=>{
      const base=gcmDefaultEffort(u),spent=logs.filter(log=>log.unitId===u.code).reduce((a,log)=>a+gcmN(log.minutes)/60,0);
      return n+Math.max(.4,base-Math.min(base*.8,spent));
    },0);
    return {...x,effortHours:effort,requiredHours:effort/(r.weeks*Math.max(.01,gcmN(s.contentShare)||.75))};
  });
  r.totalNeed=r.rows.reduce((n,x)=>n+x.requiredHours,0);
  r.needsUnmet=Math.max(0,r.totalNeed-r.totalHours);
  return r;
};
gcmBudget=function(){return gcmWeightedHours().rows};

gcmCycle=function(){
 const g=gcmDB(),rows=gcmBudget(),now=gcmWeekKey(),logs=gcmStudyLogs().slice().sort((a,b)=>b.date.localeCompare(a.date));

/* Cronograma de execução: trabalha com esforço REMANESCENTE, não "um assunto por semana". */
gcmSchedule=function(){
 const g=gcmDB(),s=g.settings,b=gcmBudget(),begin=gcmMonday(s.startDate)>gcmWeekKey()?gcmMonday(s.startDate):gcmWeekKey(),end=gcmMonday(s.planningDeadline);
 const weekKeys=[];for(let w=begin;w<=end&&weekKeys.length<110;w=gcmPlus(w,7))weekKeys.push(w);
 const weeks=Object.fromEntries(weekKeys.map(w=>[w,{week:w,subjects:{}}]));
 const logs=gcmStudyLogs();
 const models=b.map(sub=>{
   const tasks=GCM_SEED.units.filter(u=>u.subject===sub.name&&!gcmIsCompleted(u.code)).map(u=>{
     const base=gcmDefaultEffort(u);
     const used=logs.filter(x=>x.unitId===u.code&&!['Revisão ativa','Flashcards','Redação'].includes(x.method)).reduce((sum,x)=>sum+gcmN(x.minutes)/60,0);
     return {u,hours:Math.max(.4,base-Math.min(base*.8,used))};
   });
   return {sub,tasks,cursor:0,total:tasks.reduce((n,x)=>n+x.hours,0),planned:0};
 });
 const share=Scheduler.clamp(Number(s.contentShare)||.75,.1,1);
 for(let wi=0;wi<weekKeys.length;wi++){
   const w=weekKeys[wi],futureCount=weekKeys.length-wi,
     weekLog=gcmStudyLogs([w,gcmPlus(w,6)]),
     contentLogged=weekLog.filter(x=>!['Revisão ativa','Flashcards','Questões','Redação'].includes(x.method)).reduce((n,x)=>n+gcmN(x.minutes)/60,0),
     totalLogged=weekLog.reduce((n,x)=>n+gcmN(x.minutes)/60,0),
     remaining=Math.max(0,Math.min(Math.max(0,s.weeklyHours*share-contentLogged),Math.max(0,s.weeklyHours-totalLogged)));
   const requirements=models.map(m=>m.total/futureCount);
   const sumReq=requirements.reduce((a,n)=>a+n,0);
   let shares;
   if(sumReq<=remaining+1e-8)shares=requirements;
   else{
     // Sob escassez de tempo, o peso da prova orienta a priorização; o déficit fica visível.
     const avg=b.reduce((n,x)=>n+x.raw,0)/Math.max(1,b.length);
     const scores=models.map((m,i)=>requirements[i]*(.65+.35*m.sub.raw/Math.max(.001,avg)));
     const result=Array(models.length).fill(0);let pool=remaining;let active=requirements.map((v,i)=>i).filter(i=>requirements[i]>0);
     for(let pass=0;pass<models.length+2&&active.length&&pool>1e-8;pass++){
       const normalizer=active.reduce((n,i)=>n+scores[i],0);
       if(normalizer<=0)break;
       let moved=0;
       for(const i of active){const candidate=pool*scores[i]/normalizer,added=Math.min(candidate,requirements[i]-result[i]);result[i]+=added;moved+=added}
       pool-=moved;active=active.filter(i=>requirements[i]-result[i]>1e-7);
     }
     shares=result;
   }
   models.forEach((m,i)=>{
     let left=shares[i],assigned=0,unitTasks=[];
     while(left>1e-8&&m.cursor<m.tasks.length){
       const item=m.tasks[m.cursor],portion=Math.min(item.hours,left);
       if(portion>1e-8)unitTasks.push({id:item.u.code,name:item.u.name,group:item.u.group,hours:portion});
       item.hours-=portion;left-=portion;assigned+=portion;
       if(item.hours<=1e-7)m.cursor++;
     }
     m.total-=assigned;m.planned+=assigned;
     weeks[w].subjects[m.sub.name]={hours:assigned,done:gcmCycleDone(m.sub.name,w),capacity:remaining,tasks:unitTasks,subject:m.sub.name};
   });
 }
 const diagnostics={};models.forEach(m=>{
   const n=GCM_SEED.units.filter(u=>u.subject===m.sub.name&&!gcmIsCompleted(u.code)).length;
   diagnostics[m.sub.name]={estimated:m.total+m.planned,available:m.planned,shortage:Math.max(0,m.total),left:n};
 });
 return {weeks,weekKeys,diagnostics,budget:b};
};

const EM_SCOPE_FIELDS = ['subjects','topics','questions','attempts','exams','notes','goals','activeGoalId','syllabusImports','profile','cycles','config','mode'];
let emScopedDb = null, emScopedId = null;
function emCaptureCore(){const out={};for(const k of EM_SCOPE_FIELDS)out[k]=db[k];return out;}
function emNewCore(name,date){const d=defaults();d.profile.examName=name;d.profile.deadline=date||'';return Object.fromEntries(EM_SCOPE_FIELDS.map(k=>[k,d[k]]));}
function emExam(name,subjects=[],units=[],data=null){const d=data||gcmBase(),now=gcmISO();if(!data){d.settings={...d.settings,startDate:now,examDate:'',planningDeadline:'',weeklyHours:0,questionCount:{},pointWeight:{},difficulty:{},allocation:{},weights:{},dailyHours:[0,0,0,0,0,0,0]};}return {id:mkId(),name,subjects:subjects.map(s=>({...s})),units:units.map(u=>({...u})),data:d,core:emNewCore(name,d.settings.examDate)};}

function emStash(){if(!db.contests?.length)return;const current=db.contests.find(x=>x.id===emScopedId);if(current){current.core=emCaptureCore();current.data=db.gcm;}}
function emHydrate(exam){if(!exam)return;const d=defaults();for(const k of EM_SCOPE_FIELDS)db[k]=(exam.core&&exam.core[k]!==undefined)?exam.core[k]:d[k];db.gcm=exam.data;GCM_SUBJECTS=exam.subjects.filter(s=>s.active!==false);GCM_SEED.units=exam.units;db.activeContestId=exam.id;emScopedId=exam.id;emScopedDb=db;}
function emEnsure(){
 if(emScopedDb!==db){emScopedDb=db;emScopedId=null;}
 if(!Array.isArray(db.contests)||!db.contests.length){
   // Os dados anteriores entram intactos como o primeiro concurso, inclusive o edital de 122 assuntos.
   const saved=db.gcm&&typeof db.gcm==='object';
   const initial= saved?emExam('GCM Firmino Alves · 2026/27',EM_TEMPLATE_SUBJECTS,EM_TEMPLATE_UNITS,db.gcm):emExam('Meu primeiro concurso');
   initial.core=emCaptureCore();if(!saved){initial.core=emNewCore(initial.name,'');}
   db.contests=[initial];db.activeContestId=initial.id;
 }
 let active=emCurrent();if(!active){active=db.contests[0];db.activeContestId=active.id;}
 if(emScopedId!==active.id)emHydrate(active);
 return active;
}

  clean.activeContestId=clean.contests.some(x=>x.id===input.activeContestId)?input.activeContestId:clean.contests[0]?.id;
 }
 return clean;
};

function emWelcome(){return `<section class="card em-welcome"><div class="eyebrow">COMECE PELO ESSENCIAL</div><h2>Monte seu concurso sem planilhas.</h2><p class="muted">Cadastre a primeira disciplina, preencha as questões e os pontos no edital e informe seu tempo disponível em cada dia. O ciclo se encarrega de distribuir as horas.</p><div class="em-steps"><div><b>1</b><strong>Disciplinas</strong><small>Adicione somente as que caem na prova.</small></div><div><b>2</b><strong>Horários</strong><small>Informe horas de segunda a domingo.</small></div><div><b>3</b><strong>Ciclo livre</strong><small>Estude na ordem que quiser; o saldo é automático.</small></div></div><div class="row start"><button class="btn" data-act="emManageSubjects">+ Adicionar primeira disciplina</button><button class="btn ghost" data-act="emEditContest">Editar prova e prazo</button><button class="btn ghost" data-act="emCreateTemplate">Usar modelo GCM Firmino Alves</button></div></section>`;}
const emOldGcmStat=gcmStat;
gcmStat=function(){const r=emOldGcmStat();return {...r,ratio:GCM_SEED.units.length?r.ratio:0};};
const emOldGcmDashboard=gcmDashboard;
gcmDashboard=function(){let s=emOldGcmDashboard();const total=GCM_SEED.units.length;s=s.replaceAll('/122','/'+total).replaceAll('122 assuntos',total+' assuntos').replaceAll('para as três matérias','para todas as matérias').replaceAll('das três matérias','das disciplinas informadas');return s;};
const emOldGcmSyllabus=gcmSyllabus;
gcmSyllabus=function(){let s=emOldGcmSyllabus();const total=GCM_SEED.units.length;return `<div class="row start em-editor-tools"><button class="btn" data-act="emNewTopic">+ Adicionar assunto</button><button class="btn secondary" data-act="emManageSubjects">Gerenciar disciplinas</button></div>`+s.replaceAll('122 unidades distribuídas em três matérias.',total+' assuntos cadastrados nas disciplinas do seu concurso.').replaceAll('/122','/'+total).replaceAll('122 assuntos',total+' assuntos');};
const emOldQuickChecklist=gcmQuickChecklist;
gcmQuickChecklist=function(){return emOldQuickChecklist().replaceAll('/122','/'+GCM_SEED.units.length);};
const emOldCycleSettingsCard=gcmCycleSettingsCard;
gcmCycleSettingsCard=function(){let html=emOldCycleSettingsCard(),g=gcmDB(),s=g.settings;const saved=Array.isArray(s.dailyHours)&&s.dailyHours.length===7;const rows=(saved?s.dailyHours:[0,0,0,0,0,0,0]);const weekdays=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];const daily=`<div class="em-daily-panel"><div class="row"><div><h3>Quanto tempo você tem em cada dia?</h3><p class="small">Preencha de segunda a domingo. Zero significa descanso. O total semanal é somado automaticamente.</p></div><span class="chip green">Disponibilidade personalizada</span></div>${!saved&&s.weeklyHours>0?`<p class="alert info">Sua meta antiga é ${gcmFmt(s.weeklyHours,1)}h/sem. Preencha os dias abaixo para substituí-la; até salvar, a meta anterior permanece.</p>`:''}<div class="em-daily-grid">${weekdays.map((day,i)=>`<label>${day}<span><input name="daily${i}" type="number" min="0" max="24" step=".5" value="${E(rows[i])}" aria-label="Horas na ${day}"> h</span></label>`).join('')}</div><p class="small"><strong id="emDailySum">${saved?gcmFmt(rows.reduce((a,x)=>a+Number(x),0),1):'—'}h</strong> disponíveis na semana · o sistema não obriga uma rotação de matérias.</p></div>`;
 html=html.replace('<div class="studio-cycle-hours">',daily+'<div class="studio-cycle-hours">');html=html.replace('id="cycleHours" type="number"','id="cycleHours" type="number" readonly');
 html=html.replace('Monte seu ciclo pelos pesos reais','Distribua seu tempo, do seu jeito');html=html.replace('A soma das metas será exatamente esse valor.','Calculado automaticamente a partir da sua disponibilidade diária.');
 html=html.replace('<div class="studio-cycle-metrics">',`<div class="em-metrics-head"><h3>Disciplinas e peso na prova</h3><button type="button" class="btn secondary" data-act="emManageSubjects">+ Adicionar ou editar matérias</button></div><details class="em-explain"><summary>Como as metas são calculadas?</summary><p>Questões da matéria × valor de cada questão × fator de dificuldade. A pontuação oficial e sua dificuldade são coisas diferentes. O site divide o total de horas na proporção dessas prioridades e arredonda em blocos de 30 minutos.</p><p>O fator pessoal de dificuldade varia de 0,8 a 1,2. É uma regra organizacional ajustável, não uma certeza científica.</p></details><div class="studio-cycle-metrics">`);
 html=html.replace('Português tem <b>20 questões × 2 pontos = 40 pontos</b>; Matemática tem <b>10 × 1 = 10 pontos</b>. Com dificuldade igual, Português recebe <b>4 vezes</b> a prioridade de Matemática.', 'Disciplina A tem <b>20 questões × 2 pontos = 40 pontos</b>; Disciplina B tem <b>10 × 1 = 10 pontos</b>. Com dificuldade igual, A recebe <b>4 vezes</b> a prioridade de B.');
 return html;
};
const emOldCyclePreview=gcmCyclePreview;
gcmCyclePreview=function(form){return emOldCyclePreview(form);};
// O formulário de configurações usa as mesmas disciplinas dinâmicas; evita a antiga validação fixa de três matérias.
const emOldSubmit=gcmHandleSubmit;
gcmHandleSubmit=function(form){
 if(!['emContestForm','emEditContestForm','emSubjectForm','emTopicForm','gcmCycleWeightsForm','gcmStudioSettingsForm'].includes(form.id))return emOldSubmit(form);
 const v=Object.fromEntries(new FormData(form).entries());
 if(form.id==='emContestForm'){
  const name=String(v.name||'').trim().slice(0,100),date=v.examDate,deadline=v.deadline,subject=String(v.subject||'').trim().slice(0,70);
  if(!name||!date||!deadline||deadline>date){toast('Confira nome, data da prova e prazo de conclusão.');return true;}
  emEnsure();if(db.contests.length>=30){toast('Limite de 30 concursos neste navegador.');return true;}
  emStash();const e=emExam(name,subject?[{name:subject,color:EM_COLORS[0],weight:1,active:true}]:[]);
  e.data.settings.examDate=date;e.data.settings.planningDeadline=deadline;e.core.profile.deadline=date;e.core.profile.examName=name;db.contests.push(e);emHydrate(e);gcmTab='ciclo';save();closeModal();navigate('gcm');toast('Novo concurso criado, separado dos anteriores.');return true;
 }
 if(form.id==='emEditContestForm'){
  const e=emEnsure(),name=String(v.name||'').trim().slice(0,100);
  if(!name||!v.examDate||!v.deadline||v.deadline>v.examDate){toast('Confira as datas e o nome.');return true;}
  e.name=name;e.data.settings.examDate=v.examDate;e.data.settings.planningDeadline=v.deadline;db.profile.examName=name;db.profile.deadline=v.examDate;save();closeModal();render();return true;
 }
 if(form.id==='emSubjectForm'){
  const e=emEnsure(),name=String(v.name||'').trim().slice(0,70),old=form.dataset.old||'',color=/^#[0-9a-f]{6}$/i.test(v.color)?v.color:EM_COLORS[0];
  if(!name||e.subjects.some(s=>s.name.toLocaleLowerCase('pt-BR')===name.toLocaleLowerCase('pt-BR')&&s.name!==old)){toast('Use um nome de disciplina único.');return true;}
  if(old){emChangeSubject(old,name,color);}else{if(e.subjects.length>=75){toast('Limite de 75 disciplinas.');return true;}e.subjects.push({name,color,weight:1,active:true});let s=gcmDB().settings;s.pointWeight[name]=1;s.questionCount[name]=0;s.difficulty[name]=3;s.allocation[name]=1/Math.max(1,e.subjects.length);if(!e.subjects.some(x=>x.active!==false&&gcmDB().settings.questionCount[x.name]>0)){const acts=e.subjects.filter(x=>x.active!==false);for(const a of acts)gcmDB().settings.allocation[a.name]=1/Math.max(1,acts.length);}emHydrate(e);}
  if(!old){const subj=e.subjects.find(x=>x.name===name);if(!db.subjects.some(x=>x.name===name))db.subjects.push({id:mkId(),name,color:subj?.color||color,weight:1});}save();render();emManageSubjects();toast(old?'Disciplina atualizada.':'Disciplina adicionada ao ciclo.');return true;
 }
 if(form.id==='emTopicForm'){
  const e=emEnsure(),title=String(v.title||'').trim().slice(0,250),sub=v.subject,group=String(v.group||'').trim().slice(0,100);
  if(!title||!GCM_SUBJECTS.some(x=>x.name===sub)){toast('Informe um assunto e uma disciplina válidos.');return true;}
  const id='EM-'+mkId();e.units.push({code:id,name:title,subject:sub,group,origin:'Adicionado pelo usuário'});let ss=db.subjects.find(x=>x.name===sub);if(!ss){const meta=GCM_SUBJECTS.find(x=>x.name===sub);ss={id:mkId(),name:sub,color:meta?.color||EM_COLORS[0],weight:1};db.subjects.push(ss);}db.topics.push({id,title,subjectId:ss.id,type:'conceito',priority:3,minutes:20,group,prerequisiteId:''});save();closeModal();gcmTab='edital';render();toast('Assunto cadastrado no checklist e cronograma.');return true;
 }
 if(form.id==='gcmCycleWeightsForm'){
  const g=gcmDB(),daily=Array.from({length:7},(_,i)=>Number(v['daily'+i]));
  const hasDaily=daily.some(x=>x>0);if(daily.some(x=>!Number.isFinite(x)||x<0||x>24||Math.abs(x*2-Math.round(x*2))>1e-8)){toast('Use horas diárias de 0 a 24 em passos de 30 minutos.');return true;}
  const h=hasDaily?daily.reduce((a,b)=>a+b,0):Number(v.weeklyHours);
  if(h<=0||h>140){toast('Informe uma disponibilidade semanal entre 0,5h e 140h.');return true;}
  if(!GCM_SUBJECTS.length){toast('Adicione pelo menos uma disciplina.');return true;}
  const q={},p={},d={};let positive=0;
  for(const [i,s] of GCM_SUBJECTS.entries()){
   const raw=v['questions'+i];const n=raw===''?0:Number(raw),weight=Number(v['point'+i]),diff=Number(v['diff'+i]);
   if(!Number.isInteger(n)||n<0||n>1000||weight<.1||weight>20||!Number.isInteger(diff)||diff<1||diff>5){toast('Verifique questões, pontos e dificuldade.');return true;}
   if(n>0)positive++;q[s.name]=n;p[s.name]=weight;d[s.name]=diff;
  }
  if(positive>0&&positive!==GCM_SUBJECTS.length){toast('Informe as questões de todas as disciplinas ativas (inclusive a única, se houver) ou deixe todas sem valores para o cálculo provisório.');return true;}
  if(hasDaily)db.profile.availability=daily.map(n=>Math.round(n*60));
  Object.assign(g.settings,{weeklyHours:h,dailyHours:hasDaily?daily:g.settings.dailyHours,questionCount:{...g.settings.questionCount,...q},pointWeight:{...g.settings.pointWeight,...p},difficulty:{...g.settings.difficulty,...d}});
  save();render();toast('Disponibilidade e prioridades salvas; ciclo, gráficos e cronograma recalculados.');return true;
 }
 if(form.id==='gcmStudioSettingsForm'){
  const g=gcmDB();const dates=[v.startDate,v.examDate,v.planningDeadline];if(dates.some(x=>!/^\d{4}-\d{2}-\d{2}$/.test(x))||v.planningDeadline<v.startDate||v.planningDeadline>v.examDate){toast('Informe datas válidas para o concurso.');return true;}
  const q={},p={},d={};let positive=0;for(const [i,s] of GCM_SUBJECTS.entries()){
   const n=Number(v['questions'+i]||0),weight=Number(v['point'+i]),diff=Number(v['diff'+i]);if(!Number.isInteger(n)||n<0||n>1000||!(weight>=.1&&weight<=20)||!(diff>=1&&diff<=5)){toast('Revise os dados das disciplinas.');return true;}if(n>0)positive++;q[s.name]=n;p[s.name]=weight;d[s.name]=diff;
  }
  if(positive&&positive!==GCM_SUBJECTS.length){toast('Preencha as questões de todas as disciplinas ativas.');return true;}
  const h=Number(v.weeklyHours);if(!(h>0&&h<=140)){toast('Informe uma quantidade válida de horas semanais.');return true;}
  Object.assign(g.settings,{startDate:v.startDate,examDate:v.examDate,planningDeadline:v.planningDeadline,weeklyHours:h,questionCount:{...g.settings.questionCount,...q},pointWeight:{...g.settings.pointWeight,...p},difficulty:{...g.settings.difficulty,...d},contentShare:Number(v.contentShare)||.75,revisionFraction:Number(v.revisionFraction)/100,revisionGrowth:Number(v.revisionGrowth),revisionMinimum:Number(v.revisionMinimum),revisionMaximum:Number(v.revisionMaximum)});
  db.profile.deadline=v.examDate;save();render();toast('Configuração recalculada.');return true;
 }
 return true;
};
const emOldActions=gcmHandleAction;
gcmHandleAction=function(action,id,value){
 if(action==='emCreateContest'){emCreateContest();return true;}
 if(action==='emCreateTemplate'){emCreateTemplate();return true;}
 if(action==='emEditContest'){emEditContest();return true;}
 if(action==='emManageSubjects'){emManageSubjects();return true;}
 if(action==='emEditSubject'){emManageSubjects(id);return true;}
 if(action==='emNewTopic'){emNewTopic();return true;}
 if(action==='emDeleteSubject'){
  const e=emEnsure(),g=gcmDB(),item=e.subjects.find(x=>x.name===id);if(!item)return true;
  const linked=e.units.some(u=>u.subject===id)||(g.studyLogs||[]).some(x=>x.subject===id)||(g.questionLogs||[]).some(x=>x.subject===id)||(g.materials||[]).some(x=>x.subject===id)||(g.mockExams||[]).some(x=>x.bySubject&&id in x.bySubject);
  if(linked){toast('Esta matéria tem assuntos ou registros. Use Arquivar para não perder o histórico.');return true;}
  if(!confirm('Excluir a disciplina '+id+'? Você só poderá recuperá-la por backup.'))return true;
  e.subjects=e.subjects.filter(x=>x!==item);for(const key of ['questionCount','pointWeight','difficulty','allocation','weights'])delete g.settings[key]?.[id];
  db.subjects=db.subjects.filter(x=>x.name!==id);emHydrate(e);save();render();emManageSubjects();toast('Disciplina vazia excluída.');return true;
 }
 if(action==='emToggleSubject'){
  const e=emEnsure(),s=e.subjects.find(x=>x.name===id);if(!s)return true;
  if(s.active!==false&&e.subjects.filter(x=>x.active!==false).length===1){toast('Mantenha pelo menos uma disciplina ativa ou crie outra antes de arquivar.');return true;}
  s.active=s.active===false;emHydrate(e);save();emManageSubjects();render();toast(s.active?'Disciplina reativada.':'Disciplina arquivada, sem apagar dados.');return true;
 }
 return emOldActions(action,id,value);
};
const emOldNewMock=gcmNewMock;
// A validação de simulados não pode depender de três matérias.
const emOldMockSubmit=gcmHandleSubmit;
gcmHandleSubmit=function(form){
 if(form.id!=='gcmMockForm')return emOldMockSubmit(form);
 const g=gcmDB(),v=Object.fromEntries(new FormData(form).entries());const total=Number(v.total),correct=Number(v.correct);
 if(!Number.isInteger(total)||total<1||!Number.isInteger(correct)||correct<0||correct>total){toast('Revise questões e acertos do simulado.');return true;}
 const bySubject={};let sum=0,hits=0,filled=0;
 for(let i=0;i<GCM_SUBJECTS.length;i++){
  const nq=v['blockQ'+i],nc=v['blockC'+i];if(nq!==''||nc!==''){const q=Number(nq),c=Number(nc);if(!Number.isInteger(q)||q<1||!Number.isInteger(c)||c<0||c>q){toast('Verifique os blocos por matéria.');return true;}bySubject[GCM_SUBJECTS[i].name]={questions:q,correct:c};sum+=q;hits+=c;filled++;}
 }
 if(filled&&(filled!==GCM_SUBJECTS.length||sum!==total||hits!==correct)){toast(`Preencha todas as ${GCM_SUBJECTS.length} matérias somando os totais, ou deixe todos os blocos vazios.`);return true;}
 g.mockExams.push({id:mkId(),date:v.date,source:String(v.source||'').slice(0,120),duration:Number(v.duration)||0,total,correct,bySubject:filled?bySubject:null,notes:String(v.notes||'').slice(0,3000)});
 save();if(document.getElementById('modal').open)closeModal();render();toast('Simulado registrado.');return true;
};
// Adapta textos herdados de modelos anteriores, sem modificar seu histórico.
const emOldConfig=gcmStudioSettings;
gcmStudioSettings=function(){return `<div class="row start"><button class="btn secondary" data-act="emManageSubjects">Gerenciar disciplinas</button><button class="btn ghost" data-act="emEditContest">Nome e datas do concurso</button><button class="btn ghost" data-act="gcmTab" data-value="ciclo">Editar horas por dia no ciclo</button></div>`+emOldConfig().replace('name="weeklyHours" type="number"','name="weeklyHours" type="number" readonly title="A disponibilidade é calculada na aba Ciclo de horas"').replaceAll('três matérias','disciplinas ativas').replaceAll('três quantidades','quantidades').replaceAll('na planilha','no seu planejamento').replaceAll('para substituir a referência','para calcular conforme seu edital');};
const emOldCycle=gcmCycle;
gcmCycle=function(){return `<div class="em-cycle-intro"><strong>Sem sequência obrigatória</strong><span>1. Escolha horários → 2. Ajuste o edital → 3. Registre o que estudou. As metas são recalculadas automaticamente.</span></div>`+emOldCycle();};
const emOldChecklist=gcmQuickChecklist;
gcmQuickChecklist=function(){return emOldChecklist().replaceAll('/122','/'+GCM_SEED.units.length);};
const emOldRevisionsIcs=gcmExportRevisionsICS;
// O nome do concurso aparece no arquivo de exportação sem alterar a lógica de datas.
gcmExportRevisionsICS=function(){return emOldRevisionsIcs();};
renderCycles=function(){emEnsure();return `<div class="gcm-area">${emExamBar()}${GCM_SUBJECTS.length?gcmCycle():emWelcome()}</div>`;};
const emOldRender=render;
render=function(){emEnsure();return emOldRender();};
document.addEventListener('change',function(e){if(e.target.id==='emContestSelect')emChooseContest(e.target.value);});
document.addEventListener('input',function(e){const f=e.target.closest('#gcmCycleWeightsForm');if(!f||!e.target.matches('[name^="daily"]'))return;const sum=Array.from({length:7},(_,i)=>Number(f.elements['daily'+i]?.value)||0).reduce((a,b)=>a+b,0);const input=f.elements.weeklyHours;if(input)input.value=sum;const label=f.querySelector('#emDailySum');if(label)label.textContent=gcmFmt(sum,1)+'h';const preview=f.querySelector('#gcmCyclePreview');if(preview)preview.innerHTML=gcmCyclePreview(f);});
// A navegação principal deixa de pressupor que só existe a GCM.
const emNav=NAV.find(x=>x[0]==='gcm');if(emNav)emNav[2]='Meus concursos';
emEnsure();

render();
</script>
